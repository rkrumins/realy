# An account's status and flags after a change at the system of record (realy.accounts.v1.AccountStatusChanged):
# customer and account. On the events topic keyed by customer, so account status features are exact.
name: account_status_changed
message: realy.accounts.v1.AccountStatusChanged
id: event_id
time: event_time_us
entities:
  customer: customer_id
  account: account_id
