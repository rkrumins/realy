// Canonical payment event. Production-shaped: contains no benchmark fields.
// Benchmark timing travels separately in the `x-bench-trace` Kafka header (realy.bench.v1.BenchTrace).
syntax = "proto3";

package realy.payments.v1;

option java_package = "io.realy.contracts.payments.v1";
option java_multiple_files = true;

enum PaymentType {
  PAYMENT_TYPE_UNSPECIFIED = 0;
  CARD_PURCHASE = 1;
  ATM_WITHDRAWAL = 2;
  TRANSFER = 3;   // account-to-account push payment (instant payment rail)
  CARD_REFUND = 4;
}

enum Channel {
  CHANNEL_UNSPECIFIED = 0;
  POS = 1;
  ECOM = 2;
  ATM = 3;
  MOTO = 4;
  IN_APP = 5;
  ONLINE_BANKING = 6;
}

enum EntryMode {
  ENTRY_MODE_UNSPECIFIED = 0;
  CHIP = 1;
  CONTACTLESS = 2;
  MAGSTRIPE = 3;
  MANUAL = 4;
  WALLET_TOKEN = 5;
  ECOM_3DS = 6;
  ECOM_NON_3DS = 7;
  CREDENTIAL_ON_FILE = 8;
  BANK_APP = 9;
}

// Result of 3-D Secure (EMV 3DS) cardholder authentication carried in an online card authorisation.
enum ThreeDsResult {
  THREE_DS_NONE = 0;            // no 3DS: not an online payment, or the merchant did not try
  THREE_DS_ATTEMPTED = 1;       // the merchant attempted it; the cardholder was not authenticated
  THREE_DS_AUTHENTICATED = 2;   // authenticated (frictionless or after a challenge): liability shifts
}

enum CardType {
  CARD_TYPE_UNSPECIFIED = 0;
  DEBIT = 1;
  CREDIT = 2;
  PREPAID = 3;
  VIRTUAL = 4;
}

message TransactionEvent {
  // Globally unique, deterministic: (generator_id << 48) | sequence.
  fixed64 event_id = 1;
  // Event (simulation) time, epoch microseconds. Feature windows use this clock.
  sfixed64 event_time_us = 2;
  PaymentType payment_type = 3;

  uint64 customer_id = 4;
  uint64 account_id = 5;
  uint64 card_id = 6;            // 0 when not a card payment
  CardType card_type = 7;

  int64 amount_minor = 8;        // in `currency` minor units
  string currency = 9;           // ISO 4217
  int64 amount_usd_minor = 10;   // normalised amount (USD cents)

  uint64 merchant_id = 11;       // 0 for transfers
  uint32 mcc = 12;               // ISO 18245
  string merchant_country = 13;  // ISO 3166-1 alpha-2
  uint64 terminal_id = 14;       // POS/ATM terminal, 0 for card-not-present

  Channel channel = 15;
  EntryMode entry_mode = 16;
  bool card_present = 17;

  double lat = 18;               // transaction location (terminal, or IP geo for remote)
  double lon = 19;

  uint64 device_id = 20;         // 0 when no device (card-present)
  uint32 ip_v4 = 21;             // 0 when no IP
  string ip_country = 22;
  uint32 ip_asn = 23;

  uint64 payee_id = 24;          // transfers only

  bool cvv_match = 25;
  bool avs_match = 26;
  bool recurring = 27;
  uint32 credit_limit_usd = 28;  // card credit limit (0 for debit)

  // Authorisation signals the issuer receives with the request (alongside cvv_match / avs_match).
  ThreeDsResult three_ds = 29;   // online card payments
  bool pin_verified = 30;        // the PIN was entered and verified (chip, ATM)
  bool cryptogram_valid = 31;    // EMV chip / network-token cryptogram verified (false for magstripe, keyed)
  uint32 scheme_score = 32;      // card network risk score 0-99 carried in the request (0 = none)

  // Rich blocks: the payment's parties and context as structured sub-messages, the way a payment hub
  // carries them. All optional (absent = proto3 defaults), so payments without them are byte-identical;
  // the generic codec (bindings) reads every field of them by dotted path (card_info.status,
  // merchant_info.address.country), so features, filters, entity keys and rules can use them.
  CardInfo card_info = 40;
  AccountInfo account_info = 41;
  MerchantInfo merchant_info = 42;
  DeviceInfo device_info = 43;
  PayeeInfo payee_info = 44;
  Authentication authentication = 45;
  repeated LineItem items = 46;            // the basket (e-commerce)
  map<string, string> attributes = 47;     // free-form context from the channel
}

enum CardStatus {
  CARD_STATUS_UNSPECIFIED = 0;
  CARD_STATUS_ACTIVE = 1;
  CARD_STATUS_BLOCKED = 2;
  CARD_STATUS_LOST = 3;
  CARD_STATUS_STOLEN = 4;
  CARD_STATUS_EXPIRED = 5;
}

// The card as the authorisation saw it.
message CardInfo {
  uint64 id = 1;                 // the card (equal to card_id when both are sent)
  string bin = 2;                // first digits of the PAN (6 or 8)
  string bin_country = 3;        // ISO 3166-1 alpha-2 of the issuing BIN
  CardStatus status = 4;         // the issuer's status of the card
  string network = 5;            // VISA, MASTERCARD...
  bool tokenized = 6;            // a network token (wallet) rather than the PAN
  string wallet = 7;             // APPLE_PAY, GOOGLE_PAY, "" for none
  int64 issued_at_us = 8;
}

enum AccountType {
  ACCOUNT_TYPE_UNSPECIFIED = 0;
  ACCOUNT_CURRENT = 1;
  ACCOUNT_SAVINGS = 2;
  ACCOUNT_CREDIT = 3;
}

message AccountInfo {
  uint64 id = 1;
  AccountType type = 2;
  int64 balance_usd_minor = 3;
  uint32 age_days = 4;
  repeated string flags = 5;     // e.g. AML_HOLD, OVERDRAWN
}

message Address {
  string country = 1;
  string city = 2;
  string postcode = 3;
}

message MerchantInfo {
  uint64 id = 1;
  string name = 2;
  uint32 mcc = 3;
  Address address = 4;
  uint32 risk_tier = 5;          // the acquirer's tier, 0 (low) to 3 (high)
}

message DeviceInfo {
  uint64 id = 1;
  string os = 2;
  string app_version = 3;
  bool emulator = 4;
  bool rooted = 5;
  double risk_score = 6;         // the device intelligence score, 0..1
}

message PayeeInfo {
  uint64 id = 1;
  string bank_country = 2;
  bool new_payee = 3;            // first payment to this payee
  string name_match = 4;         // confirmation of payee: MATCH, CLOSE_MATCH, NO_MATCH, ""
}

message Authentication {
  ThreeDsResult three_ds = 1;
  uint32 attempts = 2;           // authentication attempts before this one succeeded or failed
  string method = 3;             // OTP, BIOMETRIC, PASSWORD...
  bool sca_exempt = 4;           // an SCA exemption was applied (low value, trusted beneficiary...)
}

message LineItem {
  string sku = 1;
  uint32 qty = 2;
  int64 amount_usd_minor = 3;
  string category = 4;
}
