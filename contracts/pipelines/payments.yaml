# A pipeline: which event types flow through it, how they are partitioned, which features, datasets and
# model it runs. The runner, the Flink job, the gateway, the generator, ClickHouse and the verifier all
# read the same file (PIPELINE selects one; default payments).
#
#   namespace       "" keeps today's Redis keys and ClickHouse tables; another pipeline prefixes both
#   partition_key   every record on the events topic is keyed by this entity's id: one entity's events
#                   are totally ordered (its features, and those of entities it owns, are exact)
#   default_type    the type of records without an `x-event-type` header
#   event_types     scored: the gateway / Flink decides each event; fold: it only updates state
name: payments
namespace: ""
partition_key: customer
#   transactions    multi-message transactions (contracts/transactions) whose parts arrive on the events
#                   topic; a run with traffic.flows assembles them (the Flink assembler) into `payment`
topics: { events: payments.events.raw, decisions: payments.decisions, labels: payments.labels,
          assembled: payments.events.assembled, dlq: payments.events.dlq }
default_type: payment
event_types:
  payment: { scored: true }
  # the messages of an account-to-account transfer (contracts/transactions/a2a_transfer.yaml)
  payment_initiation: {}
  device_context: {}
  payee_check: {}
  sca_result: {}
  payment_submission: {}
  payment_status: {}
  # the messages of a card payment (contracts/transactions/card_payment.yaml)
  card_authentication: {}
  card_authorization: {}
  card_capture: {}
  card_reversal: {}
  card_refund: {}
  chargeback: {}
transactions: [a2a_transfer, card_payment]
features: contracts/features/feature_schema.yaml
model: { client: kserve-v2, name: fraud_mlp, input: input__0, output: output__0 }
