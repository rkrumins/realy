[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "realy"
version = "0.1.0"
description = "Deterministic benchmarking & correctness instrument for real-time fraud scoring pipelines"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "pyarrow>=16",
  "pyyaml>=6",
  "protobuf>=5.28",
  "grpcio>=1.66",
  "confluent-kafka>=2.5",
  "redis>=5",
  "typer>=0.12",
  "rich>=13",
  "pydantic>=2.7",
  "common-expression-language>=0.10",
  "httpx>=0.27",
]

[project.optional-dependencies]
control = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "websockets>=12"]
train = ["scikit-learn>=1.5", "skl2onnx>=1.17", "onnxruntime>=1.19", "xgboost>=2.1"]
fast = ["numba>=0.60"]
dev = ["pytest>=8", "grpcio-tools>=1.66", "pytest-timeout>=2.3"]

[project.scripts]
realy = "realy.cli:app"

[tool.setuptools.packages.find]
include = ["realy*", "kserve*"]

[tool.setuptools.package-data]
realy = ["control/static/**/*", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 600
