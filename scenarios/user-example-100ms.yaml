name: user-example-100ms
description: The brief's example - 100 ms feature build + 30-100 ms model against a 150 ms budget. Must FAIL (infeasible) and show fallbacks.
seed: 42
world: { customers: 200000, merchants: 20000, payees: 40000 }
traffic:
  profile: { kind: constant, tps: 1000 }
  duration_s: 60
  warmup_s: 10
topology: gateway-kafka
scoring:
  feature_source: redis
  budget_ms: 150
  feature_deadline_ms: 140
  model_deadline_ms: 140
  feature_lookup_delay: { fixed: { ms: 100 } }
model_server:
  service_time: { uniform: { min_ms: 30, max_ms: 100 } }
  workers: 0
budget: { e2e_p99_ms: 150, hot_path_p99_ms: 150 }
expect: { verdict: FAIL }
