name: flows-smoke
description: Transfers arrive as their six linked messages (initiation, device context, payee check, SCA, submission, status) and card purchases as theirs (3-D Secure result, authorisation, capture, reversal, refund, chargeback); Flink assembles each into the unified event before the gateway scores it. 500 TPS, verified exactly, with rules over the transaction context.
seed: 42
world: { customers: 200000, merchants: 20000, payees: 40000 }
traffic:
  profile: { kind: constant, tps: 500 }
  duration_s: 60
  warmup_s: 10
  flows: [a2a_transfer, card_payment]
topology: gateway-kafka
rules: baseline-flows
fraud: { background_per_1k: 3.0, mix: { app_scam_mule: 2.0, account_takeover: 1.0, investment_scam: 1.0, card_testing: 1.0 } }
scoring:
  feature_source: redis
  budget_ms: 100
  feature_deadline_ms: 30
  model_deadline_ms: 80
  self_inclusion: true
  feature_lookup_delay: { lognormal: { median_ms: 2, p99_ms: 8 } }
model_server:
  service_time: { lognormal: { median_ms: 8, p99_ms: 25 } }
  workers: 64
  max_batch: 1
budget: { e2e_p99_ms: 150, hot_path_p99_ms: 100, min_compliance: 0.99 }
flink_state: fresh
