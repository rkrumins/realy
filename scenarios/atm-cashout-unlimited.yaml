name: atm-cashout-unlimited
description: Unlimited-operation ATM cash-out at t=40s (2,000 cards x 3-10 withdrawals in minutes) - a load spike plus ATM velocity rules.
seed: 13
world: { customers: 200000, merchants: 20000, payees: 40000 }
traffic:
  profile: { kind: constant, tps: 500 }
  duration_s: 150
  warmup_s: 15
  backfill_days: 1
topology: gateway-kafka
scoring:
  feature_source: redis
  budget_ms: 100
  feature_deadline_ms: 30
  model_deadline_ms: 80
  feature_lookup_delay: { lognormal: { median_ms: 2, p99_ms: 8 } }
model_server:
  service_time: { lognormal: { median_ms: 8, p99_ms: 25 } }
  workers: 64
budget: { e2e_p99_ms: 150, hot_path_p99_ms: 100 }
fraud:
  background_per_1k: 0.3
  campaigns:
    - { kind: atm_cashout, at_s: 40, count: 1, params: { cards: 2000, atms: 40 } }
guardrails: { max_consumer_lag: 2000000 }
