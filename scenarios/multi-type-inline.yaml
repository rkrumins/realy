name: multi-type-inline
description: "Payments plus four other message types, each carrying a subset of the keyed entities (pipeline payments-ext): logins, profile changes, card lifecycle on the payments topic keyed by customer, device telemetry on its own topic keyed by device. 500 decided payments/s with Flink scoring inline (topology A: the customer and card features, the login-fed ones included, are exact), about 0.98 extra messages per payment; the logins and the rest fold into customer, card, device and IP features and are never decided. Needs `make up PIPELINE=payments-ext`."
seed: 42
pipeline: payments-ext
world: { customers: 200000, merchants: 20000, payees: 40000 }
traffic:
  profile: { kind: constant, tps: 500 }
  duration_s: 60
  warmup_s: 10
  # messages per decided payment
  event_types: { login: 0.6, profile_change: 0.03, card_lifecycle: 0.05, device_telemetry: 0.3 }
topology: flink-inline
fraud: { background_per_1k: 3.0, mix: { account_takeover: 2.0, card_testing: 1.0, app_scam_mule: 1.0 } }
scoring:
  feature_source: redis
  budget_ms: 100
  feature_deadline_ms: 30
  model_deadline_ms: 80
  self_inclusion: true
  feature_lookup_delay: { lognormal: { median_ms: 2, p99_ms: 8 } }
model_server:
  service_time: { lognormal: { median_ms: 8, p99_ms: 25 } }
  workers: 64
  max_batch: 1
budget: { e2e_p99_ms: 150, hot_path_p99_ms: 100, min_compliance: 0.99 }
flink_state: fresh
