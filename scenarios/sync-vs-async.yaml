name: sync-vs-async
description: Same world+seed through the sync gRPC rail; compare with smoke (async gateway) and flink-inline-smoke via `realy` compare / the console.
seed: 42
world: { customers: 200000, merchants: 20000, payees: 40000 }
traffic: { profile: { kind: constant, tps: 500 }, duration_s: 90, warmup_s: 20 }
topology: gateway-grpc
sync: { mode: stream, channels: 4 }
scoring:
  feature_source: redis
  budget_ms: 100
  feature_deadline_ms: 30
  model_deadline_ms: 80
  feature_lookup_delay: { lognormal: { median_ms: 2, p99_ms: 8 } }
model_server: { service_time: { lognormal: { median_ms: 8, p99_ms: 25 } }, workers: 64 }
budget: { e2e_p99_ms: 150, hot_path_p99_ms: 100 }
