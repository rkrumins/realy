[versions]
protobuf = "4.36.2"
grpc = "1.85.1"
flink = "2.2.1"
flinkKafka = "5.0.0-2.2"
kafka = "4.2.0"
armeria = "1.43.1"
lettuce = "7.9.0.RELEASE"
cel = "0.15.0"
jackson = "2.20.1"
micrometer = "1.17.2"
hdrhistogram = "2.2.2"
slf4j = "2.0.17"
junit = "5.14.4"
assertj = "3.27.6"

[libraries]
protobuf-java = { module = "com.google.protobuf:protobuf-java", version.ref = "protobuf" }
protobuf-java-util = { module = "com.google.protobuf:protobuf-java-util", version.ref = "protobuf" }
grpc-netty-shaded = { module = "io.grpc:grpc-netty-shaded", version.ref = "grpc" }
grpc-protobuf = { module = "io.grpc:grpc-protobuf", version.ref = "grpc" }
grpc-stub = { module = "io.grpc:grpc-stub", version.ref = "grpc" }
grpc-inprocess = { module = "io.grpc:grpc-inprocess", version.ref = "grpc" }
javax-annotation = { module = "javax.annotation:javax.annotation-api", version = "1.3.2" }
flink-streaming-java = { module = "org.apache.flink:flink-streaming-java", version.ref = "flink" }
flink-clients = { module = "org.apache.flink:flink-clients", version.ref = "flink" }
flink-runtime-web = { module = "org.apache.flink:flink-runtime-web", version.ref = "flink" }
flink-runtime = { module = "org.apache.flink:flink-runtime", version.ref = "flink" }
flink-statebackend-rocksdb = { module = "org.apache.flink:flink-statebackend-rocksdb", version.ref = "flink" }
flink-connector-base = { module = "org.apache.flink:flink-connector-base", version.ref = "flink" }
flink-connector-kafka = { module = "org.apache.flink:flink-connector-kafka", version.ref = "flinkKafka" }
flink-metrics-prometheus = { module = "org.apache.flink:flink-metrics-prometheus", version.ref = "flink" }
flink-test-utils = { module = "org.apache.flink:flink-test-utils", version.ref = "flink" }
kafka-clients = { module = "org.apache.kafka:kafka-clients", version.ref = "kafka" }
armeria = { module = "com.linecorp.armeria:armeria", version.ref = "armeria" }
armeria-grpc = { module = "com.linecorp.armeria:armeria-grpc", version.ref = "armeria" }
lettuce = { module = "io.lettuce:lettuce-core", version.ref = "lettuce" }
cel = { module = "dev.cel:cel", version.ref = "cel" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
jackson-yaml = { module = "com.fasterxml.jackson.dataformat:jackson-dataformat-yaml", version.ref = "jackson" }
micrometer-prometheus = { module = "io.micrometer:micrometer-registry-prometheus", version.ref = "micrometer" }
hdrhistogram = { module = "org.hdrhistogram:HdrHistogram", version.ref = "hdrhistogram" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj = { module = "org.assertj:assertj-core", version.ref = "assertj" }

[plugins]
protobuf = { id = "com.google.protobuf", version = "0.10.1" }
shadow = { id = "com.gradleup.shadow", version = "8.3.9" }
