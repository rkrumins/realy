# The secrets the pipeline reads as files (never as plain environment values). Create it from your secret
# store (External Secrets, Vault, sealed secrets); this file is only the shape, do not commit real values.
apiVersion: v1
kind: Secret
metadata: { name: pipeline-secrets, namespace: payments-scoring }
type: Opaque
stringData:
  kafka-sasl-password: REPLACE
  model-token: "Bearer REPLACE"
  admin-token: REPLACE                         # PUT /admin/config needs "Authorization: Bearer <this>"
  redis-uri: rediss://payments-scoring:REPLACE@REPLACE-redis:6379
