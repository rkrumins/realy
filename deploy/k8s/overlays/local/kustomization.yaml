# Self-contained local cluster (k3d / kind / minikube / Docker Desktop): no operators, no CRDs, small
# resource requests, images imported from the local Docker daemon. One command:
#   make k8s-local                       (deploy/k8s/local-up.sh: build, cluster, import, apply, wait)
# or, with the realy/* images already loaded into the cluster:
#   kubectl apply -k deploy/k8s/overlays/local
# Console: NodePort 30090 (local-up.sh maps it to http://localhost:8090), Flink UI: NodePort 30081.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: realy
resources:
  - ../../base
components:
  - ../../components/standalone
patches:
  # images come from `k3d image import` / `kind load`; never try a registry for them
  - target: { kind: Deployment|StatefulSet, labelSelector: "app in (gateway,mock-model,console,flink)" }
    patch: |-
      - { op: add, path: /spec/template/spec/containers/0/imagePullPolicy, value: IfNotPresent }
  - target: { kind: Service, name: console }
    patch: |-
      - { op: add, path: /spec/type, value: NodePort }
      - { op: add, path: /spec/ports/0/nodePort, value: 30090 }
  - target: { kind: Service, name: flink-jobmanager }
    patch: |-
      - { op: add, path: /spec/type, value: NodePort }
      - { op: add, path: /spec/ports/0/nodePort, value: 30081 }
  - target: { kind: Deployment, name: console }
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata: { name: console }
      spec:
        template:
          spec:
            containers:
              - name: console
                env:
                  - { name: FLINK_UI_URL, value: "http://localhost:8081" }
                resources:
                  requests: { cpu: 500m, memory: 1Gi }
                  limits: { cpu: "4", memory: 6Gi }
  - target: { kind: PersistentVolumeClaim, name: realy-console }
    patch: |-
      - { op: replace, path: /spec/resources/requests/storage, value: 20Gi }
  - target: { kind: Deployment, name: gateway }
    patch: |-
      - { op: replace, path: /spec/replicas, value: 1 }
      - { op: replace, path: /spec/template/spec/containers/0/resources, value: { requests: { cpu: 500m, memory: 1Gi }, limits: { cpu: "2", memory: 2Gi } } }
  - target: { kind: Deployment, name: gateway }
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata: { name: gateway }
      spec:
        template:
          spec:
            containers:
              - name: gateway
                env:
                  - { name: JAVA_OPTS, value: "-XX:+UseZGC -XX:+ZGenerational -Xmx1g" }
                  - { name: KAFKA_CONSUMERS, value: "3" }
  - target: { kind: StatefulSet, name: realy-kafka }
    patch: |-
      apiVersion: apps/v1
      kind: StatefulSet
      metadata: { name: realy-kafka }
      spec:
        template:
          spec:
            containers:
              - name: kafka
                env:
                  - { name: KAFKA_HEAP_OPTS, value: "-Xms768m -Xmx768m" }
  - target: { kind: HorizontalPodAutoscaler, name: gateway }
    patch: |-
      - { op: replace, path: /spec/minReplicas, value: 1 }
      - { op: replace, path: /spec/maxReplicas, value: 2 }
  - target: { kind: PodDisruptionBudget, name: gateway }
    patch: |-
      - { op: replace, path: /spec/minAvailable, value: 0 }
  - target: { kind: Deployment, name: mock-model }
    patch: |-
      - { op: replace, path: /spec/replicas, value: 1 }
      - { op: replace, path: /spec/template/spec/containers/0/resources, value: { requests: { cpu: 250m, memory: 768Mi }, limits: { cpu: "2", memory: 1536Mi } } }
  - target: { kind: StatefulSet, name: redis }
    patch: |-
      - { op: replace, path: /spec/template/spec/containers/0/resources, value: { requests: { cpu: 250m, memory: 1Gi }, limits: { cpu: "1", memory: 2Gi } } }
      - { op: replace, path: /spec/template/spec/containers/0/args, value: ["--save", "", "--appendonly", "no", "--maxmemory", "1500mb", "--maxmemory-policy", "allkeys-lru"] }
  - target: { kind: StatefulSet, name: clickhouse }
    patch: |-
      - { op: replace, path: /spec/template/spec/containers/0/resources, value: { requests: { cpu: 500m, memory: 1Gi }, limits: { cpu: "2", memory: 4Gi } } }
      - { op: replace, path: /spec/volumeClaimTemplates/0/spec/resources/requests/storage, value: 10Gi }
  - target: { kind: StatefulSet, name: realy-kafka }
    patch: |-
      - { op: replace, path: /spec/template/spec/containers/0/resources, value: { requests: { cpu: 500m, memory: 1536Mi }, limits: { cpu: "2", memory: 1536Mi } } }
      - { op: replace, path: /spec/volumeClaimTemplates/0/spec/resources/requests/storage, value: 10Gi }
  - target: { kind: Deployment, name: flink-taskmanager }
    patch: |-
      - { op: replace, path: /spec/template/spec/containers/0/resources, value: { requests: { cpu: 500m, memory: 3Gi }, limits: { cpu: "3", memory: 3Gi } } }
  - target: { kind: Deployment, name: flink-taskmanager }
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata: { name: flink-taskmanager }
      spec:
        template:
          spec:
            containers:
              - name: taskmanager
                env:
                  - name: FLINK_PROPERTIES
                    value: |
                      jobmanager.rpc.address: flink-jobmanager
                      taskmanager.numberOfTaskSlots: 4
                      taskmanager.memory.process.size: 3g
                      taskmanager.memory.managed.fraction: 0.35
                      taskmanager.memory.jvm-metaspace.size: 512m
                      classloader.resolve-order: parent-first
                      state.backend.type: rocksdb
                      execution.checkpointing.dir: file:///checkpoints
                      metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
                      metrics.reporter.prom.port: 9249
  - target: { kind: PersistentVolumeClaim, name: flink-checkpoints }
    patch: |-
      - { op: replace, path: /spec/resources/requests/storage, value: 5Gi }
