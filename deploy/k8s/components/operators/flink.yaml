# Flink Kubernetes Operator (>= 1.10) FlinkDeployments in application mode (one cluster per job).
# Image: realy/flink (deploy/docker/Dockerfile target `flink`) - the job jar sits in /opt/flink/lib/realy
# on the system classpath and loads parent-first, the same image the compose stack and the standalone
# session cluster use.
# `features` (Topology B) runs permanently; `inline` (Topology A) is suspended until a run needs it.
# Switching keeps state: the operator's savepoint upgrade mode restores keyed RocksDB state (same uids).
apiVersion: flink.apache.org/v1beta1
kind: FlinkDeployment
metadata:
  name: realy-features
spec:
  image: realy/flink:dev
  flinkVersion: v2_2
  serviceAccount: flink
  flinkConfiguration:
    taskmanager.numberOfTaskSlots: "4"
    classloader.resolve-order: parent-first
    state.backend.type: rocksdb
    execution.checkpointing.incremental: "true"
    execution.checkpointing.dir: gs://REPLACE_BUCKET/realy/checkpoints
    execution.checkpointing.savepoint-dir: gs://REPLACE_BUCKET/realy/savepoints
    state.backend.rocksdb.localdir: /rocksdb
    state.backend.rocksdb.memory.managed: "true"
    taskmanager.memory.managed.fraction: "0.4"
    metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
    metrics.reporter.prom.port: "9249"
    metrics.fetcher.update-interval: "2000"
    kubernetes.operator.savepoint.history.max.count: "5"
    # fault tolerance (docs/dev/flink-job.md): tolerate a slow checkpoint, keep the newest two on
    # cancellation, restart with backoff forever, exit a TaskManager whose heap runs out, keep about 1 s
    # of data in flight under backpressure, and recover the JobManager from Kubernetes HA
    execution.checkpointing.num-retained: "2"
    execution.checkpointing.externalized-checkpoint-retention: RETAIN_ON_CANCELLATION
    execution.checkpointing.tolerable-failed-checkpoints: "3"
    restart-strategy.type: exponential-delay
    restart-strategy.exponential-delay.initial-backoff: 1 s
    restart-strategy.exponential-delay.max-backoff: 60 s
    restart-strategy.exponential-delay.backoff-multiplier: "2.0"
    restart-strategy.exponential-delay.reset-backoff-threshold: 10 min
    restart-strategy.exponential-delay.jitter-factor: "0.1"
    taskmanager.jvm-exit-on-oom: "true"
    taskmanager.network.memory.buffer-debloat.enabled: "true"
    state.backend.rocksdb.predefined-options: FLASH_SSD_OPTIMIZED
    state.backend.rocksdb.use-bloom-filter: "true"
    high-availability.type: kubernetes
    high-availability.storageDir: gs://REPLACE_BUCKET/realy/ha
  jobManager:
    resource: { cpu: 2, memory: 4g }
  taskManager:
    resource: { cpu: 4, memory: 16g }
    podTemplate:
      spec:
        containers:
          - name: flink-main-container
            env:
              - { name: KAFKA_BOOTSTRAP, value: realy-kafka-bootstrap:9092 }
              - { name: REDIS_URI, value: redis://redis:6379 }
              - { name: MODEL_TARGET, value: mock-model:8001 }
            volumeMounts: [{ name: rocksdb, mountPath: /rocksdb }]
        volumes:
          - name: rocksdb          # local NVMe SSD on the node pool (overlay sets the storage)
            emptyDir: {}
  job:
    jarURI: local:///opt/flink/lib/realy/realy-flink-job.jar
    entryClass: io.realy.flink.FraudJob
    args: ["--mode", "features", "--parallelism", "24", "--bootstrap", "realy-kafka-bootstrap:9092",
           "--group", "realy-flink", "--checkpoint-ms", "10000", "--buffer-timeout-ms", "1",
           "--max-parallelism", "128"]
    parallelism: 24
    upgradeMode: savepoint
    state: running
---
apiVersion: flink.apache.org/v1beta1
kind: FlinkDeployment
metadata:
  name: realy-inline
spec:
  image: realy/flink:dev
  flinkVersion: v2_2
  serviceAccount: flink
  flinkConfiguration:
    taskmanager.numberOfTaskSlots: "4"
    classloader.resolve-order: parent-first
    state.backend.type: rocksdb
    execution.checkpointing.incremental: "true"
    execution.checkpointing.dir: gs://REPLACE_BUCKET/realy/checkpoints-inline
    execution.checkpointing.savepoint-dir: gs://REPLACE_BUCKET/realy/savepoints-inline
    state.backend.rocksdb.localdir: /rocksdb
    # fault tolerance (docs/dev/flink-job.md): tolerate a slow checkpoint, keep the newest two on
    # cancellation, restart with backoff forever, exit a TaskManager whose heap runs out, keep about 1 s
    # of data in flight under backpressure, and recover the JobManager from Kubernetes HA
    execution.checkpointing.num-retained: "2"
    execution.checkpointing.externalized-checkpoint-retention: RETAIN_ON_CANCELLATION
    execution.checkpointing.tolerable-failed-checkpoints: "3"
    restart-strategy.type: exponential-delay
    restart-strategy.exponential-delay.initial-backoff: 1 s
    restart-strategy.exponential-delay.max-backoff: 60 s
    restart-strategy.exponential-delay.backoff-multiplier: "2.0"
    restart-strategy.exponential-delay.reset-backoff-threshold: 10 min
    restart-strategy.exponential-delay.jitter-factor: "0.1"
    taskmanager.jvm-exit-on-oom: "true"
    taskmanager.network.memory.buffer-debloat.enabled: "true"
    state.backend.rocksdb.predefined-options: FLASH_SSD_OPTIMIZED
    state.backend.rocksdb.use-bloom-filter: "true"
    high-availability.type: kubernetes
    high-availability.storageDir: gs://REPLACE_BUCKET/realy/ha-inline
    metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
    metrics.reporter.prom.port: "9249"
    metrics.fetcher.update-interval: "2000"
  jobManager:
    resource: { cpu: 2, memory: 4g }
  taskManager:
    resource: { cpu: 4, memory: 16g }
    podTemplate:
      spec:
        containers:
          - name: flink-main-container
            env:
              - { name: KAFKA_BOOTSTRAP, value: realy-kafka-bootstrap:9092 }
              - { name: REDIS_URI, value: redis://redis:6379 }
              - { name: MODEL_TARGET, value: mock-model:8001 }
            volumeMounts: [{ name: rocksdb, mountPath: /rocksdb }]
        volumes:
          - { name: rocksdb, emptyDir: {} }
  job:
    jarURI: local:///opt/flink/lib/realy/realy-flink-job.jar
    entryClass: io.realy.flink.FraudJob
    args: ["--mode", "both", "--parallelism", "24", "--bootstrap", "realy-kafka-bootstrap:9092",
           "--group", "realy-flink-inline", "--async-capacity", "1000", "--checkpoint-ms", "10000",
           "--max-parallelism", "128"]
    parallelism: 24
    upgradeMode: savepoint
    state: suspended
