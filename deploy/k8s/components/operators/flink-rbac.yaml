# Service account the Flink Kubernetes Operator runs the realy job clusters under.
apiVersion: v1
kind: ServiceAccount
metadata: { name: flink }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: flink }
rules:
  - apiGroups: [""]
    resources: [pods, configmaps, services]
    verbs: ["*"]
  - apiGroups: [apps]
    resources: [deployments, deployments/finalizers]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: flink }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: flink }
subjects: [{ kind: ServiceAccount, name: flink }]
