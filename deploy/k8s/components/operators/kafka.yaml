# Strimzi Kafka (KRaft, no ZooKeeper). Requires the Strimzi operator (>= 0.45) in the cluster.
# Strimzi names the bootstrap Service `realy-kafka-bootstrap`; components/standalone mirrors that name.
# 3 brokers so acks=all / min.insync.replicas=2 behave like production (the audit WAL depends on it).
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaNodePool
metadata:
  name: brokers
  labels: { strimzi.io/cluster: realy }
spec:
  replicas: 3
  roles: [controller, broker]
  storage:
    type: jbod
    volumes:
      - { id: 0, type: persistent-claim, size: 200Gi, deleteClaim: false, kraftMetadata: shared }
  resources:
    requests: { cpu: "4", memory: 16Gi }
    limits: { cpu: "4", memory: 16Gi }
  jvmOptions: { "-Xms": 6g, "-Xmx": 6g }
  template:
    pod:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector: { matchLabels: { strimzi.io/cluster: realy, strimzi.io/kind: Kafka } }
              topologyKey: kubernetes.io/hostname
---
apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: realy
  annotations:
    strimzi.io/node-pools: enabled
    strimzi.io/kraft: enabled
spec:
  kafka:
    version: 4.1.0
    metadataVersion: 4.1-IV1
    listeners:
      - { name: plain, port: 9092, type: internal, tls: false }
    config:
      default.replication.factor: 3
      min.insync.replicas: 2
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      auto.create.topics.enable: false
      num.network.threads: 8
      num.io.threads: 16
      socket.send.buffer.bytes: 1048576
      socket.receive.buffer.bytes: 1048576
      group.initial.rebalance.delay.ms: 0
  entityOperator:
    topicOperator: {}
