# KRaft Kafka (each pod is broker + controller) from the stock apache/kafka image - no operator needed.
# The client Service is named `realy-kafka-bootstrap`, exactly like Strimzi's, so the rest of the stack is
# identical across components/standalone and components/operators.
# 1 broker here (replication factor 1: functional and latency work); components/kafka-3-brokers turns it
# into a 3-broker quorum with RF 3 / min ISR 2 so acks=all behaves like production.
apiVersion: v1
kind: Service
metadata:
  name: realy-kafka-bootstrap
  labels: { app: kafka }
spec:
  selector: { app: kafka }
  ports: [{ name: client, port: 9092, targetPort: 9092 }]
---
# Headless: gives every broker a stable DNS name (realy-kafka-N.realy-kafka-headless.<ns>.svc...) to
# advertise and to reach the other controllers on; published before readiness so the quorum can form.
apiVersion: v1
kind: Service
metadata:
  name: realy-kafka-headless
  labels: { app: kafka }
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: { app: kafka }
  ports: [{ name: client, port: 9092, targetPort: 9092 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: realy-kafka
  labels: { app: kafka }
spec:
  serviceName: realy-kafka-headless
  replicas: 1                          # components/kafka-3-brokers sets 3 (and the replication settings)
  # Parallel, not OrderedReady: a KRaft quorum needs a majority of voters up before any broker is
  # ready, so starting pods one at a time would deadlock with more than one broker. (Immutable, so it
  # is the same for 1 and N brokers - switching between them never requires recreating the StatefulSet.)
  podManagementPolicy: Parallel
  selector: { matchLabels: { app: kafka } }
  template:
    metadata: { labels: { app: kafka } }
    spec:
      # the image turns every KAFKA_* variable into a broker property; service links would inject some
      enableServiceLinks: false
      securityContext: { fsGroup: 1000 }   # appuser
      terminationGracePeriodSeconds: 60    # controlled shutdown moves partition leadership first
      containers:
        - name: kafka
          image: apache/kafka:4.4.0
          # node id, advertised listener and quorum voters are derived from the pod ordinal
          command: ["bash", "/realy/kafka-start.sh"]
          ports:
            - { name: client, containerPort: 9092 }
            - { name: controller, containerPort: 9093 }
          env:
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: POD_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
            - { name: REALY_KAFKA_REPLICAS, value: "1" }
            - { name: REALY_KAFKA_HEADLESS, value: realy-kafka-headless }
            - { name: CLUSTER_ID, value: cmVhbHktc3RhbmRhbG9uZQ }
            - { name: KAFKA_PROCESS_ROLES, value: "broker,controller" }
            - { name: KAFKA_LISTENERS, value: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093" }
            - { name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT" }
            - { name: KAFKA_INTER_BROKER_LISTENER_NAME, value: PLAINTEXT }
            - { name: KAFKA_CONTROLLER_LISTENER_NAMES, value: CONTROLLER }
            - { name: KAFKA_LOG_DIRS, value: /var/lib/kafka/data/logs }
            - { name: KAFKA_AUTO_CREATE_TOPICS_ENABLE, value: "false" }
            - { name: KAFKA_DEFAULT_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_MIN_INSYNC_REPLICAS, value: "1" }
            - { name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1" }
            - { name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS, value: "0" }
            - { name: KAFKA_NUM_NETWORK_THREADS, value: "4" }
            - { name: KAFKA_NUM_IO_THREADS, value: "8" }
            - { name: KAFKA_HEAP_OPTS, value: "-Xms1g -Xmx1g" }
          volumeMounts:
            - { name: data, mountPath: /var/lib/kafka/data }
            - { name: start, mountPath: /realy, readOnly: true }
          readinessProbe: { tcpSocket: { port: 9092 }, periodSeconds: 5 }
          resources:
            requests: { cpu: "2", memory: 3Gi }
            limits: { cpu: "4", memory: 3Gi }
      volumes:
        - { name: start, configMap: { name: kafka-start } }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 50Gi } }
---
# Creates the contract topics (same script as the compose stack; idempotent, retried until Kafka is up).
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-topics
spec:
  backoffLimit: 30
  template:
    spec:
      restartPolicy: OnFailure
      enableServiceLinks: false
      containers:
        - name: create
          image: apache/kafka:4.4.0
          command: ["bash", "/scripts/create-topics.sh"]
          env:
            - { name: BOOTSTRAP, value: realy-kafka-bootstrap:9092 }
            - { name: PARTITIONS, value: "12" }
            - { name: REPLICATION_FACTOR, value: "1" }   # kafka-3-brokers: 3
            - { name: MIN_ISR, value: "1" }              # kafka-3-brokers: 2
          volumeMounts: [{ name: scripts, mountPath: /scripts }]
      volumes: [{ name: scripts, configMap: { name: kafka-topics-script } }]
