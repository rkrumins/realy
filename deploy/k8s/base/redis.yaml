# Online feature store. Single primary for the benchmark; for production-scale runs point REDIS_URI at
# Redis Cluster / Memorystore (the Lettuce client pipelines per slot, so one event = one RTT per node).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  labels: { app: redis }
spec:
  serviceName: redis
  replicas: 1
  selector: { matchLabels: { app: redis } }
  template:
    metadata: { labels: { app: redis } }
    spec:
      containers:
        - name: redis
          image: redis:8.8-alpine
          args: ["--save", "", "--appendonly", "no", "--maxmemory", "24gb", "--maxmemory-policy", "allkeys-lru",
                 "--io-threads", "4"]
          ports: [{ name: redis, containerPort: 6379 }]
          resources:
            requests: { cpu: "4", memory: 28Gi }
            limits: { cpu: "4", memory: 28Gi }
          readinessProbe: { tcpSocket: { port: 6379 }, periodSeconds: 5 }
---
apiVersion: v1
kind: Service
metadata: { name: redis }
spec:
  selector: { app: redis }
  ports: [{ name: redis, port: 6379, targetPort: 6379 }]
