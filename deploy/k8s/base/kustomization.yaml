apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: realy
resources:
  - namespace.yaml
  - kafka.yaml
  - generated/kafka-topics.yaml
  - redis.yaml
  - generated/contract-protos.yaml
  - generated/clickhouse-ddl.yaml
  - clickhouse.yaml
  - flink.yaml
  - mock-model.yaml
  - gateway.yaml
  - bench.yaml
  - monitoring.yaml
patches:
  - path: generated/clickhouse-protos-volume.patch.yaml
labels:
  - pairs: { app.kubernetes.io/part-of: realy }
    includeSelectors: false
