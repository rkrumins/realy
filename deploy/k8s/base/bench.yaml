# Bench driver (emitters + collectors in ONE pod = one clock domain for end-to-end latency) and the
# operator console. The driver runs on its own node pool so it never competes with the system under test.
apiVersion: batch/v1
kind: Job
metadata:
  name: bench-run
  labels: { app: bench-driver }
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata: { labels: { app: bench-driver } }
    spec:
      restartPolicy: Never
      containers:
        - name: driver
          image: realy/bench:dev
          args: ["run", "step-ramp"]
          env:
            - { name: KAFKA_BOOTSTRAP, value: realy-kafka-bootstrap:9092 }
            - { name: REDIS_URI, value: redis://redis:6379 }
            - { name: GATEWAY_ADMIN, value: http://gateway:8080 }
            - { name: GATEWAY_GRPC, value: gateway:8080 }
            - { name: MODEL_ADMIN, value: http://mock-model:8002 }
            - { name: FLINK_REST, value: "" }        # FlinkDeployments are managed by the operator
            - { name: CLICKHOUSE_URL, value: http://clickhouse:8123 }
            - { name: REALY_RUNS, value: /runs }
          volumeMounts: [{ name: runs, mountPath: /runs }]
          resources:
            requests: { cpu: "8", memory: 16Gi }
            limits: { cpu: "8", memory: 16Gi }
      volumes:
        - { name: runs, persistentVolumeClaim: { claimName: bench-runs } }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: bench-runs }
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 200Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: console
  labels: { app: console }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: console } }
  template:
    metadata: { labels: { app: console } }
    spec:
      containers:
        - name: console
          image: realy/bench:dev
          args: ["console", "--port", "8090"]
          ports: [{ name: http, containerPort: 8090 }]
          env:
            - { name: KAFKA_BOOTSTRAP, value: realy-kafka-bootstrap:9092 }
            - { name: REDIS_URI, value: redis://redis:6379 }
            - { name: GATEWAY_ADMIN, value: http://gateway:8080 }
            - { name: GATEWAY_GRPC, value: gateway:8080 }
            - { name: MODEL_ADMIN, value: http://mock-model:8002 }
            - { name: FLINK_REST, value: "" }
            - { name: CLICKHOUSE_URL, value: http://clickhouse:8123 }
            - { name: REALY_RUNS, value: /runs }
          volumeMounts: [{ name: runs, mountPath: /runs }]
          resources:
            requests: { cpu: "8", memory: 16Gi }
            limits: { cpu: "8", memory: 16Gi }
      volumes:
        - { name: runs, persistentVolumeClaim: { claimName: bench-runs } }
---
apiVersion: v1
kind: Service
metadata: { name: console }
spec:
  selector: { app: console }
  ports: [{ name: http, port: 8090, targetPort: 8090 }]
