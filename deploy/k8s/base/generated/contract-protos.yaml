  kserve__v2__grpc_predict_v2.proto: "// Copyright 2020 kubeflow.org.\n//\n// Licensed\
    \ under the Apache License, Version 2.0 (the \"License\");\n// you may not use\
    \ this file except in compliance with the License.\n// You may obtain a copy of\
    \ the License at\n//\n//    http://www.apache.org/licenses/LICENSE-2.0\n//\n//\
    \ Unless required by applicable law or agreed to in writing, software\n// distributed\
    \ under the License is distributed on an \"AS IS\" BASIS,\n// WITHOUT WARRANTIES\
    \ OR CONDITIONS OF ANY KIND, either express or implied.\n// See the License for\
    \ the specific language governing permissions and\n// limitations under the License.\n\
    \nsyntax = \"proto3\";\npackage inference;\n\n// realy: added Java codegen options\
    \ (no wire changes). Source: kserve/kserve docs/predict-api/v2.\noption java_package\
    \ = \"io.realy.contracts.kserve.v2\";\noption java_multiple_files = true;\n\n\
    // Inference Server GRPC endpoints.\nservice GRPCInferenceService\n{\n  // The\
    \ ServerLive API indicates if the inference server is able to receive \n  // and\
    \ respond to metadata and inference requests.\n  rpc ServerLive(ServerLiveRequest)\
    \ returns (ServerLiveResponse) {}\n\n  // The ServerReady API indicates if the\
    \ server is ready for inferencing.\n  rpc ServerReady(ServerReadyRequest) returns\
    \ (ServerReadyResponse) {}\n\n  // The ModelReady API indicates if a specific\
    \ model is ready for inferencing.\n  rpc ModelReady(ModelReadyRequest) returns\
    \ (ModelReadyResponse) {}\n\n  // The ServerMetadata API provides information\
    \ about the server. Errors are \n  // indicated by the google.rpc.Status returned\
    \ for the request. The OK code \n  // indicates success and other codes indicate\
    \ failure.\n  rpc ServerMetadata(ServerMetadataRequest) returns (ServerMetadataResponse)\
    \ {}\n\n  // The per-model metadata API provides information about a model. Errors\
    \ are \n  // indicated by the google.rpc.Status returned for the request. The\
    \ OK code \n  // indicates success and other codes indicate failure.\n  rpc ModelMetadata(ModelMetadataRequest)\
    \ returns (ModelMetadataResponse) {}\n\n  // The ModelInfer API performs inference\
    \ using the specified model. Errors are\n  // indicated by the google.rpc.Status\
    \ returned for the request. The OK code \n  // indicates success and other codes\
    \ indicate failure.\n  rpc ModelInfer(ModelInferRequest) returns (ModelInferResponse)\
    \ {}\n}\n\nmessage ServerLiveRequest {}\n\nmessage ServerLiveResponse\n{\n  //\
    \ True if the inference server is live, false if not live.\n  bool live = 1;\n\
    }\n\nmessage ServerReadyRequest {}\n\nmessage ServerReadyResponse\n{\n  // True\
    \ if the inference server is ready, false if not ready.\n  bool ready = 1;\n}\n\
    \nmessage ModelReadyRequest\n{\n  // The name of the model to check for readiness.\n\
    \  string name = 1;\n\n  // The version of the model to check for readiness. If\
    \ not given the\n  // server will choose a version based on the model and internal\
    \ policy.\n  string version = 2;\n}\n\nmessage ModelReadyResponse\n{\n  // True\
    \ if the model is ready, false if not ready.\n  bool ready = 1;\n}\n\nmessage\
    \ ServerMetadataRequest {}\n\nmessage ServerMetadataResponse\n{\n  // The server\
    \ name.\n  string name = 1;\n\n  // The server version.\n  string version = 2;\n\
    \n  // The extensions supported by the server.\n  repeated string extensions =\
    \ 3;\n}\n\nmessage ModelMetadataRequest\n{\n  // The name of the model.\n  string\
    \ name = 1;\n\n  // The version of the model to check for readiness. If not given\
    \ the\n  // server will choose a version based on the model and internal policy.\n\
    \  string version = 2;\n}\n\nmessage ModelMetadataResponse\n{\n  // Metadata for\
    \ a tensor.\n  message TensorMetadata\n  {\n    // The tensor name.\n    string\
    \ name = 1;\n\n    // The tensor data type.\n    string datatype = 2;\n\n    //\
    \ The tensor shape. A variable-size dimension is represented\n    // by a -1 value.\n\
    \    repeated int64 shape = 3;\n  }\n\n  // The model name.\n  string name = 1;\n\
    \n  // The versions of the model available on the server.\n  repeated string versions\
    \ = 2;\n\n  // The model's platform. See Platforms.\n  string platform = 3;\n\n\
    \  // The model's inputs.\n  repeated TensorMetadata inputs = 4;\n\n  // The model's\
    \ outputs.\n  repeated TensorMetadata outputs = 5;\n}\n\nmessage ModelInferRequest\n\
    {\n  // An input tensor for an inference request.\n  message InferInputTensor\n\
    \  {\n    // The tensor name.\n    string name = 1;\n\n    // The tensor data\
    \ type.\n    string datatype = 2;\n\n    // The tensor shape.\n    repeated int64\
    \ shape = 3;\n\n    // Optional inference input tensor parameters.\n    map<string,\
    \ InferParameter> parameters = 4;\n\n    // The tensor contents using a data-type\
    \ format. This field must\n    // not be specified if \"raw\" tensor contents\
    \ are being used for\n    // the inference request.\n    InferTensorContents contents\
    \ = 5;\n  }\n\n  // An output tensor requested for an inference request.\n  message\
    \ InferRequestedOutputTensor\n  {\n    // The tensor name.\n    string name =\
    \ 1;\n\n    // Optional requested output tensor parameters.\n    map<string, InferParameter>\
    \ parameters = 2;\n  }\n\n  // The name of the model to use for inferencing.\n\
    \  string model_name = 1;\n\n  // The version of the model to use for inference.\
    \ If not given the\n  // server will choose a version based on the model and internal\
    \ policy.\n  string model_version = 2;\n\n  // Optional identifier for the request.\
    \ If specified will be\n  // returned in the response.\n  string id = 3;\n\n \
    \ // Optional inference parameters.\n  map<string, InferParameter> parameters\
    \ = 4;\n\n  // The input tensors for the inference.\n  repeated InferInputTensor\
    \ inputs = 5;\n\n  // The requested output tensors for the inference. Optional,\
    \ if not\n  // specified all outputs produced by the model will be returned.\n\
    \  repeated InferRequestedOutputTensor outputs = 6;\n\n  // The data contained\
    \ in an input tensor can be represented in \"raw\"\n  // bytes form or in the\
    \ repeated type that matches the tensor's data\n  // type. To use the raw representation\
    \ 'raw_input_contents' must be\n  // initialized with data for each tensor in\
    \ the same order as\n  // 'inputs'. For each tensor, the size of this content\
    \ must match\n  // what is expected by the tensor's shape and data type. The raw\n\
    \  // data must be the flattened, one-dimensional, row-major order of\n  // the\
    \ tensor elements without any stride or padding between the\n  // elements. Note\
    \ that the FP16 and BF16 data types must be represented as\n  // raw content as\
    \ there is no specific data type for a 16-bit float type.\n  //\n  // If this\
    \ field is specified then InferInputTensor::contents must\n  // not be specified\
    \ for any input tensor.\n  repeated bytes raw_input_contents = 7;\n}\n\nmessage\
    \ ModelInferResponse\n{\n  // An output tensor returned for an inference request.\n\
    \  message InferOutputTensor\n  {\n    // The tensor name.\n    string name =\
    \ 1;\n\n    // The tensor data type.\n    string datatype = 2;\n\n    // The tensor\
    \ shape.\n    repeated int64 shape = 3;\n\n    // Optional output tensor parameters.\n\
    \    map<string, InferParameter> parameters = 4;\n\n    // The tensor contents\
    \ using a data-type format. This field must\n    // not be specified if \"raw\"\
    \ tensor contents are being used for\n    // the inference response.\n    InferTensorContents\
    \ contents = 5;\n  }\n\n  // The name of the model used for inference.\n  string\
    \ model_name = 1;\n\n  // The version of the model used for inference.\n  string\
    \ model_version = 2;\n\n  // The id of the inference request if one was specified.\n\
    \  string id = 3;\n\n  // Optional inference response parameters.\n  map<string,\
    \ InferParameter> parameters = 4;\n\n  // The output tensors holding inference\
    \ results.\n  repeated InferOutputTensor outputs = 5;\n\n  // The data contained\
    \ in an output tensor can be represented in\n  // \"raw\" bytes form or in the\
    \ repeated type that matches the\n  // tensor's data type. To use the raw representation\
    \ 'raw_output_contents'\n  // must be initialized with data for each tensor in\
    \ the same order as\n  // 'outputs'. For each tensor, the size of this content\
    \ must match\n  // what is expected by the tensor's shape and data type. The raw\n\
    \  // data must be the flattened, one-dimensional, row-major order of\n  // the\
    \ tensor elements without any stride or padding between the\n  // elements. Note\
    \ that the FP16 and BF16 data types must be represented as\n  // raw content as\
    \ there is no specific data type for a 16-bit float type.\n  //\n  // If this\
    \ field is specified then InferOutputTensor::contents must\n  // not be specified\
    \ for any output tensor.\n  repeated bytes raw_output_contents = 6;\n}\n\n// An\
    \ inference parameter value. The Parameters message describes a \n// \u201Cname\u201D\
    /\u201Dvalue\u201D pair, where the \u201Cname\u201D is the name of the parameter\n\
    // and the \u201Cvalue\u201D is a boolean, integer, or string corresponding to\
    \ \n// the parameter.\nmessage InferParameter\n{\n  // The parameter value can\
    \ be a string, an int64, a boolean\n  // or a message specific to a predefined\
    \ parameter.\n  oneof parameter_choice\n  {\n    // A boolean parameter value.\n\
    \    bool bool_param = 1;\n\n    // An int64 parameter value.\n    int64 int64_param\
    \ = 2;\n\n    // A string parameter value.\n    string string_param = 3;\n  }\n\
    }\n\n// The data contained in a tensor represented by the repeated type\n// that\
    \ matches the tensor's data type. Protobuf oneof is not used\n// because oneofs\
    \ cannot contain repeated fields.\nmessage InferTensorContents\n{\n  // Representation\
    \ for BOOL data type. The size must match what is\n  // expected by the tensor's\
    \ shape. The contents must be the flattened,\n  // one-dimensional, row-major\
    \ order of the tensor elements.\n  repeated bool bool_contents = 1;\n\n  // Representation\
    \ for INT8, INT16, and INT32 data types. The size\n  // must match what is expected\
    \ by the tensor's shape. The contents\n  // must be the flattened, one-dimensional,\
    \ row-major order of the\n  // tensor elements.\n  repeated int32 int_contents\
    \ = 2;\n\n  // Representation for INT64 data types. The size must match what\n\
    \  // is expected by the tensor's shape. The contents must be the\n  // flattened,\
    \ one-dimensional, row-major order of the tensor elements.\n  repeated int64 int64_contents\
    \ = 3;\n\n  // Representation for UINT8, UINT16, and UINT32 data types. The size\n\
    \  // must match what is expected by the tensor's shape. The contents\n  // must\
    \ be the flattened, one-dimensional, row-major order of the\n  // tensor elements.\n\
    \  repeated uint32 uint_contents = 4;\n\n  // Representation for UINT64 data types.\
    \ The size must match what\n  // is expected by the tensor's shape. The contents\
    \ must be the\n  // flattened, one-dimensional, row-major order of the tensor\
    \ elements.\n  repeated uint64 uint64_contents = 5;\n\n  // Representation for\
    \ FP32 data type. The size must match what is\n  // expected by the tensor's shape.\
    \ The contents must be the flattened,\n  // one-dimensional, row-major order of\
    \ the tensor elements.\n  repeated float fp32_contents = 6;\n\n  // Representation\
    \ for FP64 data type. The size must match what is\n  // expected by the tensor's\
    \ shape. The contents must be the flattened,\n  // one-dimensional, row-major\
    \ order of the tensor elements.\n  repeated double fp64_contents = 7;\n\n  //\
    \ Representation for BYTES data type. The size must match what is\n  // expected\
    \ by the tensor's shape. The contents must be the flattened,\n  // one-dimensional,\
    \ row-major order of the tensor elements.\n  repeated bytes bytes_contents = 8;\n\
    }\n"
  realy__bench__v1__control.proto: "// Runtime configuration + control plane. Serialized\
    \ as proto3 JSON (snake_case field names)\n// on the compacted `bench.control`\
    \ topic, in scenario YAML files and on admin HTTP endpoints,\n// so Java services\
    \ and Python tools share one schema.\nsyntax = \"proto3\";\n\npackage realy.bench.v1;\n\
    \noption java_package = \"io.realy.contracts.bench.v1\";\noption java_multiple_files\
    \ = true;\n\n// ---------------- latency distributions (all values milliseconds)\
    \ ----------------\nmessage Fixed { double ms = 1; }\nmessage Uniform { double\
    \ min_ms = 1; double max_ms = 2; }\nmessage Normal { double mean_ms = 1; double\
    \ sd_ms = 2; double min_ms = 3; double max_ms = 4; }\n// Parameterised by median\
    \ and p99 (more intuitive than mu/sigma); optional hard cap.\nmessage LogNormal\
    \ { double median_ms = 1; double p99_ms = 2; double max_ms = 3; }\n// Mostly-lognormal\
    \ body plus an occasional uniform tail spike (GC pause, retransmit, ...).\nmessage\
    \ Bimodal { double median_ms = 1; double p99_ms = 2; double tail_prob = 3; double\
    \ tail_min_ms = 4; double tail_max_ms = 5; }\n// Piecewise-linear inverse CDF:\
    \ quantiles[i] in [0,1] ascending, ms[i] the value at that quantile.\nmessage\
    \ Empirical { repeated double quantiles = 1; repeated double ms = 2; }\n\nmessage\
    \ LatencyDist {\n  oneof dist {\n    Fixed fixed = 1;\n    Uniform uniform = 2;\n\
    \    Normal normal = 3;\n    LogNormal lognormal = 4;\n    Bimodal bimodal = 5;\n\
    \    Empirical empirical = 6;\n  }\n  double error_rate = 10;     // fraction\
    \ of calls failing fast\n  double timeout_rate = 11;   // fraction of calls that\
    \ never answer (caller deadline fires)\n}\n\n// ---------------- mock model server\
    \ (KServe v2) capacity model ----------------\nmessage ModelServerConfig {\n \
    \ LatencyDist service_time = 1;     // service time of one batch (base)\n  double\
    \ per_item_us = 2;           // extra compute per item in a batch\n  uint32 workers\
    \ = 3;               // concurrent batches (GPU instances / CUDA streams); 0 =\
    \ unlimited\n  uint32 max_batch = 4;             // dynamic batching: max items\
    \ per batch (1 = off)\n  uint32 max_queue_delay_us = 5;    // dynamic batching:\
    \ max wait to fill a batch\n  uint32 max_queue = 6;             // queued requests\
    \ beyond this are rejected (0 = unbounded)\n  string model_version = 7;\n  string\
    \ weights_path = 8;          // mock model server: load these proxy weights (hot\
    \ redeploy); \"\" = keep\n}\n\nenum OnDeadline {\n  FALLBACK_RULES = 0;      \
    \     // rules-only decision, flagged degraded\n  TIMEOUT = 1;               \
    \   // fail the request (sync) / emit nothing until done (async)\n  PROVISIONAL_THEN_ASYNC\
    \ = 2;   // answer provisionally now, publish final decision later\n}\n\nenum\
    \ AuditFailure {\n  SPOOL_LOCAL = 0;   // append to local WAL, replay later, never\
    \ block payments\n  FAIL_CLOSED = 1;   // decline when the audit record cannot\
    \ be made durable\n}\n\n// ---------------- scoring orchestrator (gateway + Flink\
    \ inline) ----------------\nmessage ScoringConfig {\n  string version = 1;\n \
    \ uint32 budget_ms = 2;                 // overall hot-path budget (deadline from\
    \ ingest)\n  uint32 feature_deadline_ms = 3;       // per-stage deadline for feature\
    \ lookup\n  uint32 model_deadline_ms = 4;         // per-stage deadline for model\
    \ call\n  OnDeadline on_deadline = 5;\n  LatencyDist feature_lookup_delay = 6;\
    \ // injected on top of the real store, per lookup\n  LatencyDist model_extra_delay\
    \ = 7;    // injected client-side before the model call\n  string feature_source\
    \ = 8;            // \"redis\" | \"mock\"\n  float review_threshold = 9;     \
    \      // > 0 overrides the rule set's thresholds.review (live tuning)\n  float\
    \ decline_threshold = 10;         // > 0 overrides the rule set's thresholds.decline\n\
    \  uint32 microbatch_window_us = 11;     // 0 = one RPC per event\n  uint32 microbatch_max\
    \ = 12;\n  uint32 hedge_after_ms = 13;           // > 0: a model call unanswered\
    \ after this sends a duplicate on another\n                                  \
    \      // channel; the first response wins (tail cut at the cost of extra load)\n\
    \  uint32 feature_sample_permille = 14;  // decisions carrying the full feature\
    \ vector (default all)\n  reserved 15;                          // was rule_set_version:\
    \ the version comes from rule_set_yaml\n  reserved \"rule_set_version\";\n  string\
    \ rule_set_yaml = 16;            // full rule set (hot reload)\n  AuditFailure\
    \ audit_on_failure = 17;\n  bool self_inclusion = 18;             // add current\
    \ event to online-store aggregates (gateway)\n  bool echo = 19;              \
    \         // calibration: decide immediately, no features/model\n  float challenge_threshold\
    \ = 20;       // > 0 overrides the rule set's thresholds.challenge (step-up band)\n\
    }\n\n// Enable/disable a service's Kafka ingress (topology switching without restarts).\
    \ On enable the\n// consumer seeks to the end of the topic, so a new run never\
    \ processes an old backlog.\nmessage IngressCommand {\n  bool kafka_enabled =\
    \ 1;\n}\n\nmessage RateCommand {\n  double tps = 1;          // absolute target\
    \ (0 = keep)\n  double multiplier = 2;   // relative change (0 = keep)\n}\n\n\
    enum RunPhase {\n  RUN_PHASE_UNSPECIFIED = 0;\n  PREPARE = 1;\n  WARMUP = 2;\n\
    \  MEASURE = 3;\n  DRAIN = 4;\n  COMPLETE = 5;\n  ABORTED = 6;\n}\n\nmessage ControlMessage\
    \ {\n  string run_id = 1;\n  sfixed64 issued_at_us = 2;\n  uint64 version = 3;\n\
    \  string target = 4;       // \"*\" | \"gateway\" | \"flink\" | \"model\" | \"\
    emitter\"\n  oneof cmd {\n    ScoringConfig scoring = 10;\n    ModelServerConfig\
    \ model_server = 11;\n    RateCommand rate = 12;\n    RunPhase phase = 13;\n \
    \   IngressCommand ingress = 14;\n  }\n}\n\n// ---------------- live telemetry\
    \ (`bench.metrics`, 1 s windows) ----------------\nmessage StageStat {\n  string\
    \ name = 1;\n  uint64 count = 2;\n  double p50_ms = 3;\n  double p90_ms = 4;\n\
    \  double p99_ms = 5;\n  double p999_ms = 6;\n  double max_ms = 7;\n}\n\nmessage\
    \ MetricsSnapshot {\n  string run_id = 1;\n  string source = 2;       // \"emitter\"\
    \ | \"collector\" | \"gateway\" | \"model\" | \"flink\"\n  string instance = 3;\n\
    \  sfixed64 ts_us = 4;      // window end\n  uint32 window_ms = 5;\n  map<string,\
    \ double> counters = 6;\n  repeated StageStat stages = 7;\n  RunPhase phase =\
    \ 8;\n}\n"
  realy__bench__v1__trace.proto: "// In-band per-event benchmark telemetry. Travels\
    \ as the `x-bench-trace` Kafka header\n// (or ScoreRequest.trace on gRPC) and\
    \ is returned inside DecisionRecord.trace.\nsyntax = \"proto3\";\n\npackage realy.bench.v1;\n\
    \noption java_package = \"io.realy.contracts.bench.v1\";\noption java_multiple_files\
    \ = true;\n\nenum Stage {\n  STAGE_UNSPECIFIED = 0;\n  // --- service ingress\
    \ -------------------------------------------------------\n  INGEST = 10;    \
    \          // point: record received by the service (attr = IngressMode)\n  QUEUE_WAIT\
    \ = 11;          // received -> processing started\n  DESERIALIZE = 12;\n  //\
    \ --- Flink stream features --------------------------------------------------\n\
    \  SHUFFLE = 20;             // previous operator emit -> this keyed operator\
    \ (attr = Entity)\n  STATE_FEATURES = 21;      // keyed state read/update/compute\
    \ (attr = Entity)\n  FEATURE_STORE_WRITE = 22; // features -> online store (Redis)\n\
    \  // --- scoring orchestrator ---------------------------------------------------\n\
    \  FEATURE_LOOKUP = 30;      // online-store lookup incl. injected delay (attr\
    \ = lookup index)\n  FEATURE_ASSEMBLE = 31;\n  MODEL_CALL = 40;          // client-observed\
    \ model latency\n  MODEL_BATCH_WAIT = 41;    // client-side micro-batch formation\n\
    \  MODEL_SERVER_QUEUE = 42;  // reported by the model server\n  MODEL_SERVER_COMPUTE\
    \ = 43;// reported by the model server (attr = batch size)\n  RULES = 50;\n  POLICY\
    \ = 51;\n  AUDIT_ACK = 60;           // decision record durably acknowledged by\
    \ Kafka\n  SINK = 61;                // Flink sink handoff\n  DECISION = 70; \
    \           // point: decision made\n  RESPONSE = 71;            // point: sync\
    \ response written\n  FALLBACK = 80;            // point: deadline/err fallback\
    \ taken (attr = reason)\n  ASYNC_WAIT = 81;          // Flink async I/O queue\
    \ wait (attr = operator)\n}\n\nmessage Span {\n  Stage stage = 1;\n  uint32 attr\
    \ = 2;\n  fixed32 domain = 3;       // clock domain (process) the timestamps were\
    \ taken in\n  sfixed64 start_us = 4;    // epoch microseconds (calibrated clock\
    \ of `domain`)\n  sfixed32 dur_us = 5;\n}\n\nmessage BenchTrace {\n  string run_id\
    \ = 1;\n  fixed32 gen_id = 2;\n  fixed64 seq = 3;\n  sfixed64 t_intended_us =\
    \ 4;  // open-loop schedule time (coordinated-omission safe)\n  sfixed64 t_sent_us\
    \ = 5;      // handed to the producer / RPC\n  fixed32 driver_domain = 6;\n  fixed32\
    \ payload_crc32 = 7;   // crc32 of the serialized TransactionEvent\n  uint32 flags\
    \ = 8;            // bit0: sample full features into the decision record\n  repeated\
    \ Span spans = 9;\n}\n"
  realy__features__v1__features.proto: "syntax = \"proto3\";\n\npackage realy.features.v1;\n\
    \noption java_package = \"io.realy.contracts.features.v1\";\noption java_multiple_files\
    \ = true;\n\nenum Entity {\n  ENTITY_UNSPECIFIED = 0;\n  CUSTOMER = 1;\n  CARD\
    \ = 2;\n  DEVICE = 3;\n  IP = 4;\n  MERCHANT = 5;\n  TERMINAL = 6;\n  PAYEE =\
    \ 7;\n}\n\nenum FeatureSource {\n  FEATURE_SOURCE_UNSPECIFIED = 0;\n  STREAM =\
    \ 1;     // computed by the Flink feature job (windowed aggregates)\n  PROFILE\
    \ = 2;    // static / batch profile in the online store (seeded from the world)\n\
    \  DERIVED = 3;    // computed at scoring time from event + other features\n}\n\
    \nmessage EntityFreshness {\n  Entity entity = 1;\n  FeatureSource source = 2;\n\
    \  sfixed64 as_of_us = 3;        // event time the stored values were computed\
    \ for\n  sfixed64 updated_at_us = 4;   // wall time the values were written (staleness\
    \ = scoring wall time - this)\n  bool found = 5;\n}\n\n// The feature vector exactly\
    \ as served to the model. Order is defined by\n// contracts/features/feature_schema.yaml\
    \ (schema_version).\nmessage FeatureVector {\n  uint32 schema_version = 1;\n \
    \ repeated float values = 2;\n  bytes missing_bitmap = 3;     // bit i set =>\
    \ feature i was missing and defaulted\n  sfixed64 computed_at_us = 4;\n  repeated\
    \ EntityFreshness freshness = 5;\n}\n"
  realy__flows__v1__a2a.proto: "// An account-to-account payment as the messages a\
    \ payment hub really exchanges, linked by `payment_id`:\n// the customer's initiation\
    \ (pain.001-like), the device / session context the app sends beside it, the\n\
    // confirmation-of-payee check, strong customer authentication, the submission\
    \ to the scheme\n// (pacs.008-like) and its status from the scheme (pacs.002 /\
    \ pacs.004-like: settled, rejected, returned).\n// Every message carries the customer\
    \ (the partition key) and its own event id and time; together they\n// form one\
    \ transaction (contracts/transactions/a2a_transfer.yaml).\nsyntax = \"proto3\"\
    ;\n\npackage realy.flows.v1;\n\noption java_package = \"io.realy.contracts.flows.v1\"\
    ;\noption java_multiple_files = true;\n\nenum A2aChannel {\n  A2A_CHANNEL_UNSPECIFIED\
    \ = 0;\n  A2A_MOBILE_APP = 1;\n  A2A_ONLINE_BANKING = 2;\n  A2A_BRANCH = 3;\n\
    \  A2A_API = 4;            // open banking / third-party initiation\n}\n\nmessage\
    \ PaymentInitiation {\n  fixed64 event_id = 1;\n  sfixed64 event_time_us = 2;\n\
    \  fixed64 payment_id = 3;          // the transaction: every message of this\
    \ payment carries it\n  uint64 customer_id = 4;\n  uint64 account_id = 5;\n  uint64\
    \ payee_id = 6;\n  int64 amount_minor = 7;\n  string currency = 8;\n  int64 amount_usd_minor\
    \ = 9;\n  A2aChannel channel = 10;\n  bool new_payee = 11;             // the\
    \ payee was added in this session\n  string reference = 12;           // payment\
    \ reference the customer typed\n  double lat = 13;\n  double lon = 14;\n}\n\n\
    message DeviceContext {\n  fixed64 event_id = 1;\n  sfixed64 event_time_us = 2;\n\
    \  fixed64 payment_id = 3;\n  uint64 customer_id = 4;\n  uint64 device_id = 5;\n\
    \  uint32 ip_v4 = 6;\n  string ip_country = 7;\n  uint32 ip_asn = 8;\n  uint32\
    \ session_age_s = 9;        // seconds since the app session started\n  bool remote_access\
    \ = 10;         // a remote-access tool is running (screen sharing, remote control)\n\
    \  bool emulator = 11;\n  bool on_call = 12;               // the customer is\
    \ on a phone call while paying (a scam signal)\n}\n\nenum PayeeCheckResult {\n\
    \  PAYEE_CHECK_UNSPECIFIED = 0;\n  PAYEE_MATCH = 1;\n  PAYEE_CLOSE_MATCH = 2;\n\
    \  PAYEE_NO_MATCH = 3;\n  PAYEE_NOT_CHECKED = 4;           // the payee's bank\
    \ does not take part\n}\n\nmessage PayeeCheck {\n  fixed64 event_id = 1;\n  sfixed64\
    \ event_time_us = 2;\n  fixed64 payment_id = 3;\n  uint64 customer_id = 4;\n \
    \ uint64 payee_id = 5;\n  PayeeCheckResult result = 6;\n  bool account_type_mismatch\
    \ = 7;  // personal vs business account\n}\n\nenum ScaMethod {\n  SCA_METHOD_UNSPECIFIED\
    \ = 0;\n  SCA_BIOMETRIC = 1;\n  SCA_APP_PUSH = 2;\n  SCA_SMS_OTP = 3;\n  SCA_CARD_READER\
    \ = 4;\n}\n\nmessage ScaResult {\n  fixed64 event_id = 1;\n  sfixed64 event_time_us\
    \ = 2;\n  fixed64 payment_id = 3;\n  uint64 customer_id = 4;\n  ScaMethod method\
    \ = 5;\n  bool passed = 6;\n  uint32 attempt = 7;              // 1 for the first\
    \ attempt\n}\n\nenum A2aScheme {\n  A2A_SCHEME_UNSPECIFIED = 0;\n  A2A_INSTANT\
    \ = 1;                 // faster payments / SEPA instant / RTP\n  A2A_BATCH =\
    \ 2;                   // bacs / SEPA credit transfer\n  A2A_HIGH_VALUE = 3; \
    \             // CHAPS / RTGS\n}\n\nmessage PaymentSubmission {\n  fixed64 event_id\
    \ = 1;\n  sfixed64 event_time_us = 2;\n  fixed64 payment_id = 3;\n  uint64 customer_id\
    \ = 4;\n  uint64 account_id = 5;\n  uint64 payee_id = 6;             // may differ\
    \ from the initiation's: a payee changed mid-flow\n  int64 amount_minor = 7;\n\
    \  string currency = 8;\n  int64 amount_usd_minor = 9;\n  A2aScheme scheme = 10;\n\
    }\n\nenum PaymentStatusCode {\n  PAYMENT_STATUS_UNSPECIFIED = 0;\n  PAYMENT_ACCEPTED\
    \ = 1;            // the scheme accepted it\n  PAYMENT_SETTLED = 2;\n  PAYMENT_REJECTED\
    \ = 3;\n  PAYMENT_RETURNED = 4;            // the payee's bank sent it back\n\
    \  PAYMENT_RECALLED = 5;            // recalled by the sender's bank (scam reported)\n\
    }\n\nmessage PaymentStatus {\n  fixed64 event_id = 1;\n  sfixed64 event_time_us\
    \ = 2;\n  fixed64 payment_id = 3;\n  uint64 customer_id = 4;\n  PaymentStatusCode\
    \ code = 5;\n  string reason = 6;\n}\n"
  realy__flows__v1__txn.proto: "// The context of a transaction formed by several\
    \ linked messages (contracts/transactions/*.yaml): which\n// transaction, at which\
    \ stage, which of its parts were present when it was assembled, and its context\n\
    // values (CEL `txn.*`). Travels with the assembled unified event (Kafka header\
    \ `x-txn`, the Flink\n// envelope) and is recorded on its decision.\nsyntax =\
    \ \"proto3\";\n\npackage realy.flows.v1;\n\noption java_package = \"io.realy.contracts.flows.v1\"\
    ;\noption java_multiple_files = true;\n\nmessage TxnContext {\n  string transaction\
    \ = 1;          // contract name, e.g. a2a_transfer (\"\" = a one-message transaction)\n\
    \  fixed64 txn_id = 2;              // the link field's value (payment_id)\n \
    \ string stage = 3;                // \"assembled\", or the scored stage it was\
    \ decided again at\n  uint32 parts_present = 4;        // bit i = the contract's\
    \ i-th message role had arrived\n  bool partial = 5;                // assembled\
    \ at the wait deadline without a required part\n  map<string, string> strings\
    \ = 6; // context values: enums by name, strings\n  map<string, double> numbers\
    \ = 7; // context values: numbers, bools (1/0), counts, seconds\n  sfixed64 assembled_at_us\
    \ = 8;    // wall time it was assembled (the assembly wait is measured from the\
    \ trigger's ingest)\n}\n"
  realy__payments__v1__label.proto: "// Ground-truth labels. Never embedded in TransactionEvent\
    \ (no leakage); published on\n// `payments.labels` with a simulated chargeback\
    \ / report delay.\nsyntax = \"proto3\";\n\npackage realy.payments.v1;\n\noption\
    \ java_package = \"io.realy.contracts.payments.v1\";\noption java_multiple_files\
    \ = true;\n\n// Typology ids. The typology registry (contracts/usecases/typologies/*.yaml)\
    \ is the source of truth and\n// is open: a user typology takes the next free\
    \ id, and ClickHouse / reports resolve names from the\n// registry, so an id without\
    \ a name here is valid. The built-in ones are named for convenience.\nenum FraudType\
    \ {\n  FRAUD_TYPE_NONE = 0;\n  CARD_TESTING = 1;\n  ACCOUNT_TAKEOVER = 2;\n  LOST_STOLEN\
    \ = 3;\n  COUNTERFEIT = 4;\n  MERCHANT_BREACH = 5;\n  ATM_CASHOUT = 6;\n  APP_SCAM_MULE\
    \ = 7;\n  BUST_OUT = 8;\n  BOT_ECOM = 9;\n  FRIENDLY_FRAUD = 10;  // label noise:\
    \ legitimate transaction charged back\n  INVESTMENT_SCAM = 11;\n}\n\nenum LabelSource\
    \ {\n  LABEL_SOURCE_UNSPECIFIED = 0;\n  CHARGEBACK = 1;\n  CUSTOMER_REPORT = 2;\n\
    \  INVESTIGATION = 3;\n}\n\nmessage FraudLabel {\n  fixed64 event_id = 1;\n  sfixed64\
    \ label_time_us = 2;   // simulation time at which the label becomes known\n \
    \ sfixed64 event_time_us = 3;\n  bool is_fraud = 4;\n  FraudType fraud_type =\
    \ 5;\n  uint64 campaign_id = 6;\n  LabelSource source = 7;\n  uint64 customer_id\
    \ = 8;\n  uint64 card_id = 9;\n  int64 amount_usd_minor = 10;\n}\n"
  realy__payments__v1__transaction.proto: "// Canonical payment event. Production-shaped:\
    \ contains no benchmark fields.\n// Benchmark timing travels separately in the\
    \ `x-bench-trace` Kafka header (realy.bench.v1.BenchTrace).\nsyntax = \"proto3\"\
    ;\n\npackage realy.payments.v1;\n\noption java_package = \"io.realy.contracts.payments.v1\"\
    ;\noption java_multiple_files = true;\n\nenum PaymentType {\n  PAYMENT_TYPE_UNSPECIFIED\
    \ = 0;\n  CARD_PURCHASE = 1;\n  ATM_WITHDRAWAL = 2;\n  TRANSFER = 3;   // account-to-account\
    \ push payment (instant payment rail)\n  CARD_REFUND = 4;\n}\n\nenum Channel {\n\
    \  CHANNEL_UNSPECIFIED = 0;\n  POS = 1;\n  ECOM = 2;\n  ATM = 3;\n  MOTO = 4;\n\
    \  IN_APP = 5;\n  ONLINE_BANKING = 6;\n}\n\nenum EntryMode {\n  ENTRY_MODE_UNSPECIFIED\
    \ = 0;\n  CHIP = 1;\n  CONTACTLESS = 2;\n  MAGSTRIPE = 3;\n  MANUAL = 4;\n  WALLET_TOKEN\
    \ = 5;\n  ECOM_3DS = 6;\n  ECOM_NON_3DS = 7;\n  CREDENTIAL_ON_FILE = 8;\n  BANK_APP\
    \ = 9;\n}\n\n// Result of 3-D Secure (EMV 3DS) cardholder authentication carried\
    \ in an online card authorisation.\nenum ThreeDsResult {\n  THREE_DS_NONE = 0;\
    \            // no 3DS: not an online payment, or the merchant did not try\n \
    \ THREE_DS_ATTEMPTED = 1;       // the merchant attempted it; the cardholder was\
    \ not authenticated\n  THREE_DS_AUTHENTICATED = 2;   // authenticated (frictionless\
    \ or after a challenge): liability shifts\n}\n\nenum CardType {\n  CARD_TYPE_UNSPECIFIED\
    \ = 0;\n  DEBIT = 1;\n  CREDIT = 2;\n  PREPAID = 3;\n  VIRTUAL = 4;\n}\n\nmessage\
    \ TransactionEvent {\n  // Globally unique, deterministic: (generator_id << 48)\
    \ | sequence.\n  fixed64 event_id = 1;\n  // Event (simulation) time, epoch microseconds.\
    \ Feature windows use this clock.\n  sfixed64 event_time_us = 2;\n  PaymentType\
    \ payment_type = 3;\n\n  uint64 customer_id = 4;\n  uint64 account_id = 5;\n \
    \ uint64 card_id = 6;            // 0 when not a card payment\n  CardType card_type\
    \ = 7;\n\n  int64 amount_minor = 8;        // in `currency` minor units\n  string\
    \ currency = 9;           // ISO 4217\n  int64 amount_usd_minor = 10;   // normalised\
    \ amount (USD cents)\n\n  uint64 merchant_id = 11;       // 0 for transfers\n\
    \  uint32 mcc = 12;               // ISO 18245\n  string merchant_country = 13;\
    \  // ISO 3166-1 alpha-2\n  uint64 terminal_id = 14;       // POS/ATM terminal,\
    \ 0 for card-not-present\n\n  Channel channel = 15;\n  EntryMode entry_mode =\
    \ 16;\n  bool card_present = 17;\n\n  double lat = 18;               // transaction\
    \ location (terminal, or IP geo for remote)\n  double lon = 19;\n\n  uint64 device_id\
    \ = 20;         // 0 when no device (card-present)\n  uint32 ip_v4 = 21;     \
    \        // 0 when no IP\n  string ip_country = 22;\n  uint32 ip_asn = 23;\n\n\
    \  uint64 payee_id = 24;          // transfers only\n\n  bool cvv_match = 25;\n\
    \  bool avs_match = 26;\n  bool recurring = 27;\n  uint32 credit_limit_usd = 28;\
    \  // card credit limit (0 for debit)\n\n  // Authorisation signals the issuer\
    \ receives with the request (alongside cvv_match / avs_match).\n  ThreeDsResult\
    \ three_ds = 29;   // online card payments\n  bool pin_verified = 30;        //\
    \ the PIN was entered and verified (chip, ATM)\n  bool cryptogram_valid = 31;\
    \    // EMV chip / network-token cryptogram verified (false for magstripe, keyed)\n\
    \  uint32 scheme_score = 32;      // card network risk score 0-99 carried in the\
    \ request (0 = none)\n}\n"
  realy__scoring__v1__decision.proto: "syntax = \"proto3\";\n\npackage realy.scoring.v1;\n\
    \nimport \"realy/payments/v1/transaction.proto\";\nimport \"realy/features/v1/features.proto\"\
    ;\nimport \"realy/bench/v1/trace.proto\";\nimport \"realy/flows/v1/txn.proto\"\
    ;\n\noption java_package = \"io.realy.contracts.scoring.v1\";\noption java_multiple_files\
    \ = true;\n\nenum Outcome {\n  OUTCOME_UNSPECIFIED = 0;\n  APPROVE = 1;\n  REVIEW\
    \ = 2;\n  DECLINE = 3;\n  CHALLENGE = 4;   // step up before approving: 3DS /\
    \ SCA challenge online, PIN prompt in store, in-app\n                   // confirmation\
    \ of a transfer; the payment continues only if the customer passes\n}\n\nenum\
    \ IngressMode {\n  INGRESS_MODE_UNSPECIFIED = 0;\n  SYNC_GRPC = 1;\n  SYNC_HTTP\
    \ = 2;\n  ASYNC_KAFKA_GATEWAY = 3;\n  ASYNC_FLINK_INLINE = 4;\n}\n\nenum DecisionPath\
    \ {\n  PATH_FULL = 0;                // features + model + rules\n  PATH_RULES_ONLY_FALLBACK\
    \ = 1; // model/feature deadline or error -> rules only\n  PATH_PROVISIONAL =\
    \ 2;         // sync answer given before scoring finished\n  PATH_FINAL_AFTER_PROVISIONAL\
    \ = 3;\n  PATH_ECHO = 4;                // calibration topology, no processing\n\
    }\n\nmessage RuleHit {\n  string rule_id = 1;\n  Outcome action = 2;\n  string\
    \ reason = 3;\n}\n\nmessage ModelResult {\n  string model_name = 1;\n  string\
    \ model_version = 2;\n  string deployment = 3;\n  float score = 4;\n  repeated\
    \ float raw_outputs = 5;\n  fixed64 input_hash = 6;\n  bool timed_out = 7;\n \
    \ bool errored = 8;\n  uint32 batch_size = 9;\n}\n\n// System-of-record for a\
    \ decision: everything needed to reproduce, audit, or train.\nmessage DecisionRecord\
    \ {\n  fixed64 event_id = 1;\n  Outcome outcome = 2;\n  float score = 3;\n  repeated\
    \ string reason_codes = 4;\n  repeated RuleHit rule_hits = 5;\n  ModelResult model\
    \ = 6;\n  string policy_version = 7;\n  string rule_set_version = 8;\n  DecisionPath\
    \ path = 9;\n  bool degraded = 10;\n  IngressMode ingress_mode = 11;\n  string\
    \ instance_id = 12;\n  sfixed64 decided_at_us = 13;\n  uint32 revision = 14; \
    \         // 0 = first decision, 1 = final after provisional\n  realy.payments.v1.TransactionEvent\
    \ event = 15;\n  realy.features.v1.FeatureVector features = 16;\n  realy.bench.v1.BenchTrace\
    \ trace = 17;\n  uint32 feature_schema_version = 18;\n  // a transaction formed\
    \ by several linked messages: which one, at which stage, which parts it was\n\
    \  // assembled from (unset for a one-message transaction)\n  realy.flows.v1.TxnContext\
    \ txn = 19;\n}\n"
  realy__scoring__v1__scoring_service.proto: "syntax = \"proto3\";\n\npackage realy.scoring.v1;\n\
    \nimport \"realy/payments/v1/transaction.proto\";\nimport \"realy/bench/v1/trace.proto\"\
    ;\nimport \"realy/scoring/v1/decision.proto\";\n\noption java_package = \"io.realy.contracts.scoring.v1\"\
    ;\noption java_multiple_files = true;\n\n// Synchronous hot-path API (card-authorisation\
    \ style rails).\n// Unframed JSON is also accepted on the same port: POST /realy.scoring.v1.ScoringService/Score\n\
    service ScoringService {\n  rpc Score(ScoreRequest) returns (ScoreResponse);\n\
    \  // High-rate clients: one long-lived bidi stream, responses may arrive out\
    \ of order.\n  rpc ScoreStream(stream ScoreRequest) returns (stream ScoreResponse);\n\
    }\n\nmessage ScoreRequest {\n  realy.payments.v1.TransactionEvent event = 1;\n\
    \  realy.bench.v1.BenchTrace trace = 2;\n  uint32 deadline_ms = 3;   // 0 = use\
    \ the gateway's configured budget\n}\n\nmessage ScoreResponse {\n  fixed64 event_id\
    \ = 1;\n  Outcome outcome = 2;\n  float score = 3;\n  repeated string reason_codes\
    \ = 4;\n  DecisionPath path = 5;\n  bool degraded = 6;\n  sfixed64 decided_at_us\
    \ = 7;\n  realy.bench.v1.BenchTrace trace = 8;\n}\n"
