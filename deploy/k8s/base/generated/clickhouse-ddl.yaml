    \  toInt32(arraySum(arrayFilter((d, s) -> s = 40, `trace.spans.dur_us`, `trace.spans.stage`)))\
    \ AS `lat_model_call_us`,\n  toInt32(arraySum(arrayFilter((d, s) -> s = 41, `trace.spans.dur_us`,\
    \ `trace.spans.stage`))) AS `lat_model_batch_wait_us`,\n  toInt32(arraySum(arrayFilter((d,\
    \ s) -> s = 42, `trace.spans.dur_us`, `trace.spans.stage`))) AS `lat_model_server_queue_us`,\n\
    \  toInt32(arraySum(arrayFilter((d, s) -> s = 43, `trace.spans.dur_us`, `trace.spans.stage`)))\
    \ AS `lat_model_server_compute_us`,\n  toInt32(arraySum(arrayFilter((d, s) ->\
    \ s = 50, `trace.spans.dur_us`, `trace.spans.stage`))) AS `lat_rules_us`,\n  toInt32(arraySum(arrayFilter((d,\
    \ s) -> s = 51, `trace.spans.dur_us`, `trace.spans.stage`))) AS `lat_policy_us`,\n\
    \  toInt32(arraySum(arrayFilter((d, s) -> s = 81, `trace.spans.dur_us`, `trace.spans.stage`)))\
    \ AS `lat_async_wait_us`,\n  toInt32(arrayFirst((st, s) -> s = 70, `trace.spans.start_us`,\
    \ `trace.spans.stage`)\n          - arrayFirst((st, s) -> s = 10, `trace.spans.start_us`,\
    \ `trace.spans.stage`)) AS hot_path_us,\n  assumeNotNull(_timestamp_ms) AS appended_at,\n\
    \  toInt32(greatest(0, toUnixTimestamp64Milli(assumeNotNull(_timestamp_ms)) *\
    \ 1000 - decided_at_us)) AS lat_audit_append_us,\n  `rule_hits.rule_id` AS rule_ids,\n\
    \  arrayMap(a -> arrayElement(['OUTCOME_UNSPECIFIED', 'APPROVE', 'REVIEW', 'DECLINE'],\
    \ toInt32(a) + 1), `rule_hits.action`) AS rule_actions,\n  arrayMap(e -> arrayElement(['UNSPECIFIED',\
    \ 'CUSTOMER', 'CARD', 'DEVICE', 'IP', 'MERCHANT', 'TERMINAL', 'PAYEE'], toInt32(e)\
    \ + 1), `features.freshness.entity`) AS fresh_entity,\n  arrayMap(u -> if(u >\
    \ 0, decided_at_us - u, -1), `features.freshness.updated_at_us`) AS fresh_age_us,\n\
    \  `features.freshness.found` AS fresh_found\nFROM realy.decisions_queue WHERE\
    \ length(_error) = 0;\n"
  04_labels.sql: "-- GENERATED by `python -m realy.codegen` from contracts/ \u2014\
    \ do not edit by hand.\n\nCREATE TABLE IF NOT EXISTS realy.labels_queue (\n  event_id\
    \ UInt64, label_time_us Int64, event_time_us Int64, is_fraud UInt8, fraud_type\
    \ Int8,\n  campaign_id UInt64, source Int8, customer_id UInt64, card_id UInt64,\
    \ amount_usd_minor Int64\n) ENGINE = Kafka\nSETTINGS kafka_broker_list = '__KAFKA_BROKERS__',\
    \ kafka_topic_list = 'payments.labels', kafka_group_name = 'clickhouse-labels',\n\
    \         kafka_format = 'ProtobufSingle', kafka_schema = 'realy/payments/v1/label.proto:FraudLabel',\
    \ kafka_num_consumers = 1,\n         kafka_flush_interval_ms = 1000, kafka_max_block_size\
    \ = 65536, kafka_thread_per_consumer = 1,\n         kafka_handle_error_mode =\
    \ 'stream';\n\nCREATE TABLE IF NOT EXISTS realy.labels (\n  run_id LowCardinality(String),\
    \ event_id UInt64, label_time DateTime64(6), event_time DateTime64(6), is_fraud\
    \ UInt8,\n  fraud_type LowCardinality(String), campaign_id UInt64, source Int8,\
    \ customer_id UInt64, card_id UInt64,\n  amount_usd_minor Int64, ingested_at DateTime64(6)\
    \ DEFAULT now64(6)\n) ENGINE = ReplacingMergeTree(ingested_at) ORDER BY (run_id,\
    \ event_id);\n\nCREATE MATERIALIZED VIEW IF NOT EXISTS realy.labels_mv TO realy.labels\
    \ AS\nSELECT arrayElement(_headers.value, indexOf(_headers.name, 'x-run-id'))\
    \ AS run_id,\n       event_id, fromUnixTimestamp64Micro(label_time_us) AS label_time,\
    \ fromUnixTimestamp64Micro(event_time_us) AS event_time,\n       is_fraud, arrayElement(['NONE',\
    \ 'CARD_TESTING', 'ACCOUNT_TAKEOVER', 'LOST_STOLEN', 'COUNTERFEIT', 'MERCHANT_BREACH',\
    \ 'ATM_CASHOUT', 'APP_SCAM_MULE', 'BUST_OUT', 'BOT_ECOM', 'FRIENDLY_FRAUD'], toInt32(fraud_type)\
    \ + 1) AS fraud_type, campaign_id, source, customer_id, card_id, amount_usd_minor\n\
    FROM realy.labels_queue WHERE length(_error) = 0;\n"
  05_views.sql: "-- GENERATED by `python -m realy.codegen` from contracts/ \u2014\
    \ do not edit by hand.\n\n-- Point-in-time correct training set: features exactly\
    \ as served at decision time + delayed labels.\nCREATE OR REPLACE VIEW realy.v_training_dataset\
    \ AS\n-- label_time / label_delay_s say WHEN the label became known: a model trained\
    \ at time T may only use\n-- rows whose label_time <= T (realy train --labels\
    \ observed applies exactly this cut).\nSELECT d.run_id, d.event_id, d.event_time,\
    \ d.customer_id, d.card_id, d.amount_usd_minor, d.payment_type, d.channel,\n \
    \      d.outcome, d.score, d.model_version, d.feature_schema_version, d.path,\
    \ d.rule_ids, d.rule_actions, d.f_cust_count_1h, d.f_cust_count_24h, d.f_cust_amount_sum_24h,\
    \ d.f_cust_amount_avg_30d, d.f_cust_distinct_countries_24h, d.f_cust_device_novel,\
    \ d.f_cust_payee_novel, d.f_cust_ip_country_novel, d.f_cust_transfer_count_1h,\
    \ d.f_cust_transfer_sum_24h, d.f_card_count_1m, d.f_card_count_5m, d.f_card_count_1h,\
    \ d.f_card_count_24h, d.f_card_amount_sum_1h, d.f_card_amount_sum_24h, d.f_card_amount_max_7d,\
    \ d.f_card_small_cnp_count_10m, d.f_card_distinct_merchants_10m, d.f_card_distinct_merchants_24h,\
    \ d.f_card_contactless_count_30m, d.f_card_contactless_sum_30m, d.f_card_atm_count_1h,\
    \ d.f_card_atm_sum_24h, d.f_card_geo_speed_kmh, d.f_card_secs_since_last, d.f_dev_count_5m,\
    \ d.f_dev_distinct_cards_1h, d.f_dev_distinct_customers_24h, d.f_ip_count_5m,\
    \ d.f_ip_distinct_cards_1h, d.f_merch_count_1m, d.f_merch_small_cnp_count_5m,\
    \ d.f_merch_amount_sum_1h, d.f_term_count_5m, d.f_term_atm_sum_1h, d.f_payee_inbound_count_1h,\
    \ d.f_payee_inbound_sum_24h, d.f_payee_distinct_senders_24h, d.f_cust_tenure_days,\
    \ d.f_cust_segment, d.f_cust_avg_ticket_usd, d.f_merch_risk_tier, d.f_merch_fraud_rate_30d,\
    \ d.f_amount_usd, d.f_is_cnp, d.f_is_contactless, d.f_is_atm, d.f_is_transfer,\
    \ d.f_is_foreign, d.f_dist_from_home_km, d.f_amount_to_avg_ratio, d.f_local_hour,\
    \ d.f_credit_utilisation_24h,\n       ifNull(l.is_fraud, 0) AS label_is_fraud,\
    \ ifNull(l.fraud_type, 'NONE') AS label_fraud_type, l.label_time,\n       if(l.event_id\
    \ = 0, NULL, dateDiff('second', d.event_time, l.label_time)) AS label_delay_s,\
    \ l.source AS label_source\nFROM (SELECT * FROM realy.decisions FINAL WHERE revision\
    \ = 0) AS d\nLEFT JOIN (SELECT * FROM realy.labels FINAL) AS l ON l.run_id = d.run_id\
    \ AND l.event_id = d.event_id;\n\n-- Rule effectiveness against ground truth:\
    \ fires, precision, share of legitimate traffic hit.\nCREATE OR REPLACE VIEW realy.v_rule_performance\
    \ AS\nSELECT d.run_id, rule_id, any(rule_action) AS action, count() AS fires,\n\
    \       countIf(ifNull(l.is_fraud, 0) = 1) AS fraud_fires, countIf(ifNull(l.is_fraud,\
    \ 0) = 1) / count() AS precision\nFROM (SELECT run_id, event_id, rule_ids, rule_actions\
    \ FROM realy.decisions FINAL WHERE revision = 0) AS d\nARRAY JOIN d.rule_ids AS\
    \ rule_id, d.rule_actions AS rule_action\nLEFT JOIN (SELECT run_id, event_id,\
    \ is_fraud FROM realy.labels FINAL) AS l ON l.run_id = d.run_id AND l.event_id\
    \ = d.event_id\nGROUP BY d.run_id, rule_id;\n\n-- Audit completeness: transactions\
    \ that never received a decision.\nCREATE OR REPLACE VIEW realy.v_audit_gaps AS\n\
    SELECT e.run_id, e.event_id, e.customer_id, e.event_time_us, e.ingested_at\nFROM\
    \ realy.events_raw AS e\nLEFT ANTI JOIN (SELECT DISTINCT run_id, event_id FROM\
    \ realy.decisions) AS d ON d.run_id = e.run_id AND d.event_id = e.event_id;\n\n\
    -- Per-second latency/throughput from the audit log (independent second measurement).\n\
    CREATE OR REPLACE VIEW realy.v_latency_by_second AS\nSELECT run_id, toStartOfSecond(decided_at)\
    \ AS second, count() AS decisions,\n       quantileExact(0.5)(hot_path_us) / 1000\
    \ AS hot_p50_ms, quantileExact(0.99)(hot_path_us) / 1000 AS hot_p99_ms,\n    \
    \   quantileExact(0.99)(lat_feature_lookup_us) / 1000 AS feature_p99_ms, quantileExact(0.99)(lat_model_call_us)\
    \ / 1000 AS model_p99_ms,\n       quantileExact(0.99)(lat_audit_append_us) / 1000\
    \ AS audit_append_p99_ms,\n       quantileExact(0.99)(dateDiff('microsecond',\
    \ decided_at, ingested_at)) / 1000 AS audit_visibility_p99_ms,\n       countIf(degraded\
    \ = 1) AS degraded, countIf(outcome = 'DECLINE') AS declines\nFROM realy.decisions\
    \ GROUP BY run_id, second;\n"
  06_runs.sql: "-- GENERATED by `python -m realy.codegen` from contracts/ \u2014 do\
    \ not edit by hand.\n\n-- One row per benchmark run (written by the driver after\
    \ the report and after `realy verify`; the\n-- newest row per run wins). Source\
    \ of the Grafana `realy-runs` dashboard and cross-run trend queries.\nCREATE TABLE\
    \ IF NOT EXISTS realy.runs (\n  `run_id` String,\n  `scenario` LowCardinality(String),\n\
    \  `topology` LowCardinality(String),\n  `started_at` DateTime64(3),\n  `duration_s`\
    \ Nullable(Float32),\n  `verdict` LowCardinality(String),\n  `matches_expectation`\
    \ Nullable(UInt8),\n  `achieved_tps` Nullable(Float64),\n  `e2e_p50_ms` Nullable(Float64),\n\
    \  `e2e_p99_ms` Nullable(Float64),\n  `e2e_p999_ms` Nullable(Float64),\n  `hot_path_p99_ms`\
    \ Nullable(Float64),\n  `within_budget` Nullable(Float64),\n  `emitted` Nullable(UInt64),\n\
    \  `decided` Nullable(UInt64),\n  `missing` Nullable(Int64),\n  `duplicates` Nullable(Int64),\n\
    \  `degraded_fraction` Nullable(Float64),\n  `knee_tps` Nullable(Float64),\n \
    \ `sustainable` Nullable(UInt8),\n  `recall_flagged` Nullable(Float64),\n  `precision_flagged`\
    \ Nullable(Float64),\n  `false_positive_rate` Nullable(Float64),\n  `verify_passed`\
    \ Nullable(UInt8),\n  `exact_set_agreement` Nullable(Float64),\n  `gateway_cpu_ms_per_event`\
    \ Nullable(Float64),\n  `flink_cpu_ms_per_event` Nullable(Float64),\n  `abort_reason`\
    \ String,\n  `status` LowCardinality(String),\n  `abort_kind` LowCardinality(String),\n\
    \  `measured_s` Nullable(Float64),\n  `git_sha` LowCardinality(String),\n  `images`\
    \ String,\n  `report` String CODEC(ZSTD(3)),\n  `ingested_at` DateTime64(6) DEFAULT\
    \ now64(6)\n) ENGINE = ReplacingMergeTree(ingested_at)\nPARTITION BY toYYYYMM(started_at)\n\
    ORDER BY (scenario, run_id);\nALTER TABLE realy.runs ADD COLUMN IF NOT EXISTS\
    \ `status` LowCardinality(String);\nALTER TABLE realy.runs ADD COLUMN IF NOT EXISTS\
    \ `abort_kind` LowCardinality(String);\nALTER TABLE realy.runs ADD COLUMN IF NOT\
    \ EXISTS `measured_s` Nullable(Float64);\n"
