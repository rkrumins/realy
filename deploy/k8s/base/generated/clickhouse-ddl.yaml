    \ ADD COLUMN IF NOT EXISTS `lat_audit_append_us` Int32;\nALTER TABLE realy.decisions\
    \ ADD COLUMN IF NOT EXISTS `rule_ids` Array(LowCardinality(String));\nALTER TABLE\
