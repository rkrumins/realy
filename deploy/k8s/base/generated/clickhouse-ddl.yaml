    \ Int64,\n  `merchant_id` UInt64,\n  `mcc` UInt32,\n  `merchant_country` String,\n\
    \  `terminal_id` UInt64,\n  `channel` LowCardinality(String),\n  `entry_mode`\
    \ LowCardinality(String),\n  `card_present` UInt8,\n  `lat` Float64,\n  `lon`\
    \ Float64,\n  `device_id` UInt64,\n  `ip_v4` UInt32,\n  `ip_country` String,\n\
