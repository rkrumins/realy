    ALTER TABLE realy.decisions DROP COLUMN IF EXISTS `lat_audit_ack_us`;\nALTER TABLE\
    \ realy.decisions DROP COLUMN IF EXISTS `lat_sink_us`;\n\nCREATE MATERIALIZED\
