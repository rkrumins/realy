    \ 30 DAY;\n\nCREATE MATERIALIZED VIEW IF NOT EXISTS realy.events_mv TO realy.events_raw\
    \ AS\nSELECT\n  arrayElement(_headers.value, indexOf(_headers.name, 'x-run-id'))\
    \ AS run_id,\n  `event_id`,\n  `event_time_us`,\n  arrayElement(['UNSPECIFIED',\
    \ 'CARD_PURCHASE', 'ATM_WITHDRAWAL', 'TRANSFER', 'CARD_REFUND'], toInt32(payment_type)\
    \ + 1) AS `payment_type`,\n  `customer_id`,\n  `account_id`,\n  `card_id`,\n \
    \ toString(card_type) AS `card_type`,\n  `amount_minor`,\n  `currency`,\n  `amount_usd_minor`,\n\
    \  `merchant_id`,\n  `mcc`,\n  `merchant_country`,\n  `terminal_id`,\n  arrayElement(['UNSPECIFIED',\
    \ 'POS', 'ECOM', 'ATM', 'MOTO', 'IN_APP', 'ONLINE_BANKING'], toInt32(channel)\
    \ + 1) AS `channel`,\n  arrayElement(['UNSPECIFIED', 'CHIP', 'CONTACTLESS', 'MAGSTRIPE',\
    \ 'MANUAL', 'WALLET_TOKEN', 'ECOM_3DS', 'ECOM_NON_3DS', 'CREDENTIAL_ON_FILE',\
    \ 'BANK_APP'], toInt32(entry_mode) + 1) AS `entry_mode`,\n  `card_present`,\n\
    \  `lat`,\n  `lon`,\n  `device_id`,\n  `ip_v4`,\n  `ip_country`,\n  `ip_asn`,\n\
    \  `payee_id`,\n  `cvv_match`,\n  `avs_match`,\n  `recurring`,\n  `credit_limit_usd`\n\
