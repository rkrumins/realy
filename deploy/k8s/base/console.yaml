# Operator console: web UI + REST/WebSocket API + the bench driver. Emitters and collectors run in this
# one pod, so end-to-end latency is measured in a single clock domain. Runs (Parquet, reports) and
# generated worlds live on the PVC.
#
# Optional token login: create the Secret before (or after) applying, then restart the pod:
#   kubectl -n realy create secret generic realy-console --from-literal=token="$(openssl rand -hex 24)"
# Without the Secret the console is open, so keep it behind a port-forward or an authenticating ingress.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: realy-console
  labels: { app: console }
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 200Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: console
  labels: { app: console }
spec:
  replicas: 1                       # owns the run queue and the PVC: never more than one
  strategy: { type: Recreate }
  selector: { matchLabels: { app: console } }
  template:
    metadata: { labels: { app: console } }
    spec:
      enableServiceLinks: false
      # pod deletion aborts the running run; it drains and writes a partial report within
      # REALY_SHUTDOWN_GRACE_S, which must stay below this
      terminationGracePeriodSeconds: 75
      containers:
        - name: console
          image: realy/console:dev
          args: ["console", "--host", "0.0.0.0", "--port", "8090"]
          ports: [{ name: http, containerPort: 8090 }]
          env:
            - { name: KAFKA_BOOTSTRAP, value: realy-kafka-bootstrap:9092 }
            - { name: REDIS_URI, value: redis://redis:6379 }
            - { name: GATEWAY_ADMIN, value: http://gateway:8080 }
            - { name: GATEWAY_GRPC, value: gateway:8080 }
            - { name: MODEL_ADMIN, value: http://mock-model:8002 }
            - { name: CLICKHOUSE_URL, value: http://clickhouse:8123 }
            # Flink session cluster REST (components/standalone). Empty = jobs are owned by the Flink
            # Kubernetes Operator (components/operators) and the console only observes them.
            - { name: FLINK_REST, value: "" }
            - { name: FLINK_KAFKA_BOOTSTRAP, value: realy-kafka-bootstrap:9092 }
            - name: REALY_CONSOLE_TOKEN
              valueFrom: { secretKeyRef: { name: realy-console, key: token, optional: true } }
            - { name: REALY_SHUTDOWN_GRACE_S, value: "60" }
            - { name: PYTHONFAULTHANDLER, value: "1" }      # native crashes print every thread's stack
            - name: REALY_OWNER        # names this console in the pipeline lease (who holds the pipeline)
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
          volumeMounts:
            - { name: state, mountPath: /runs, subPath: runs }
            - { name: state, mountPath: /data, subPath: data }
            - { name: shm, mountPath: /dev/shm }
          readinessProbe: { httpGet: { path: /api/health, port: 8090 }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /api/health, port: 8090 }, periodSeconds: 15, failureThreshold: 8 }
          resources:
            requests: { cpu: "8", memory: 16Gi }
            limits: { cpu: "8", memory: 16Gi }
      volumes:
        - { name: state, persistentVolumeClaim: { claimName: realy-console } }
        - { name: shm, emptyDir: { medium: Memory, sizeLimit: 1Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: console
  labels: { app: console }
spec:
  selector: { app: console }
  ports: [{ name: http, port: 8090, targetPort: 8090 }]
