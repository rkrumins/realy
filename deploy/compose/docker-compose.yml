# realy — the whole platform on one machine, built from source with Docker alone.
#
#   docker compose -f deploy/compose/docker-compose.yml up -d --build      (or: make up)
#   open http://localhost:8090                                              (operator console)
#
# Services: kafka (+ topic init), redis, clickhouse (async audit via its Kafka engine), mock-model,
# gateway, flink-jobmanager + flink-taskmanager, console (UI + API + bench driver).
# Optional profile `obs`: prometheus (:9090) + grafana (:3000).
# Behind a TLS-intercepting proxy add -f deploy/compose/docker-compose.proxy.yml (make up-proxy).
name: realy

x-build: &build
  context: ../..
  dockerfile: deploy/docker/Dockerfile
  # Base images are overridable, e.g. to use a registry mirror when Docker Hub rate-limits you:
  #   PYTHON_IMAGE=mirror.gcr.io/library/python:3.13-slim make up
  args:
    GRADLE_IMAGE: ${GRADLE_IMAGE:-gradle:8.14-jdk21}
    NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}
    PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.13-slim}
    JRE_IMAGE: ${JRE_IMAGE:-eclipse-temurin:21-jre}
    FLINK_IMAGE: ${FLINK_IMAGE:-flink:2.2.1-java21}
    MAVEN_MIRROR: ${MAVEN_MIRROR:-}

x-jvm-env: &jvm-env
  KAFKA_BOOTSTRAP: kafka:29092
  RUN_SEED: "42"

# One Flink configuration for the JobManager and every TaskManager (docs/dev/flink-job.md explains each
# group). The job sets its own checkpointing guarantees too (FraudJob.configure); these are the cluster
# defaults and the parts only the cluster can set:
#   state       RocksDB, incremental checkpoints, bloom filters for point lookups (a get per event per entity)
#   failures    restart with exponential backoff forever (a dependency outage must not end the job); a
#               TaskManager whose heap runs out exits so the container restarts instead of hanging
#   flow        under backpressure keep about 1 s of data in flight: barriers stay fast, latency bounded
#   metrics     REST vertex metrics refresh every 2 s (catch-up progress in the console's Startup panel)
# (no comments inside the block: FLINK_PROPERTIES lines are handed to Flink verbatim)
x-flink-props: &flink-common |
  jobmanager.rpc.address: flink-jobmanager
  classloader.resolve-order: parent-first
  taskmanager.numberOfTaskSlots: 4
  taskmanager.memory.process.size: ${FLINK_TM_MEMORY:-3g}
  taskmanager.memory.managed.fraction: 0.35
  taskmanager.memory.jvm-metaspace.size: 512m
  state.backend.type: rocksdb
  state.backend.rocksdb.predefined-options: FLASH_SSD_OPTIMIZED
  state.backend.rocksdb.use-bloom-filter: true
  state.backend.rocksdb.metrics.estimate-num-keys: true
  state.backend.rocksdb.metrics.block-cache-usage: true
  execution.checkpointing.incremental: true
  execution.checkpointing.dir: file:///checkpoints
  execution.checkpointing.savepoint-dir: file:///checkpoints/savepoints
  execution.checkpointing.num-retained: 2
  execution.checkpointing.externalized-checkpoint-retention: RETAIN_ON_CANCELLATION
  execution.checkpointing.tolerable-failed-checkpoints: 3
  restart-strategy.type: exponential-delay
  restart-strategy.exponential-delay.initial-backoff: 1 s
  restart-strategy.exponential-delay.max-backoff: 60 s
  restart-strategy.exponential-delay.backoff-multiplier: 2.0
  restart-strategy.exponential-delay.reset-backoff-threshold: 10 min
  restart-strategy.exponential-delay.jitter-factor: 0.1
  taskmanager.jvm-exit-on-oom: true
  taskmanager.network.memory.buffer-debloat.enabled: true
  metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
  metrics.reporter.prom.port: 9249
  metrics.fetcher.update-interval: 2000

services:
  kafka:
    image: apache/kafka:4.4.0
    hostname: kafka
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: HOST://0.0.0.0:9092,DOCKER://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,DOCKER://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,DOCKER:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_NETWORK_THREADS: 4
      KAFKA_NUM_IO_THREADS: 8
      KAFKA_HEAP_OPTS: "-Xms1g -Xmx1g"
    healthcheck:
      # plain TCP probe: the kafka-*.sh tools start a full JVM per check (~20% of a core at 5 s intervals)
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9092' || exit 1"]
      interval: 5s
      retries: 30
    restart: unless-stopped

  kafka-init:
    image: apache/kafka:4.4.0
    depends_on: { kafka: { condition: service_healthy } }
    restart: "no"
    entrypoint: ["/bin/bash", "/scripts/create-topics.sh"]
    environment: { PARTITIONS: "12" }
    volumes: ["./kafka/create-topics.sh:/scripts/create-topics.sh:ro"]

  redis:
    image: redis:8.8-alpine
    ports: ["6379:6379"]
    # io-threads busy-poll; only worth it above ~100k ops/s on dedicated cores
    # noeviction: a full store rejects writes (Flink fails the task, the runner's store guardrail aborts
    # the run with the reason) instead of silently evicting feature state and profiles, which would
    # corrupt every feature read after it. Persistence is off for benchmarks: a restarted Redis is
    # reseeded by the next run (profiles) and rebuilt by Flink (stream blobs). REDIS_PERSIST=yes keeps
    # an append-only file instead.
    command: ["redis-server", "--save", "", "--appendonly", "${REDIS_PERSIST:-no}", "--appendfsync", "everysec",
              "--maxmemory", "${REDIS_MAXMEMORY:-3gb}", "--maxmemory-policy", "${REDIS_EVICTION:-noeviction}"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 30

  clickhouse:
    image: clickhouse/clickhouse-server:26.9
    ports: ["8123:8123", "9000:9000"]
    environment:
      KAFKA_BROKERS: kafka:29092
      CLICKHOUSE_SKIP_USER_SETUP: "1"
    # Production hosts: raise nofile (needs CAP_SYS_RESOURCE, unavailable in some sandboxes):
    # ulimits: { nofile: { soft: 262144, hard: 262144 } }
    volumes:
      - ../../contracts/proto:/realy-proto-src:ro
      - ../../contracts/storage/clickhouse:/realy-sql:ro
      - ./clickhouse/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
      - ./clickhouse/realy.xml:/etc/clickhouse-server/config.d/realy.xml:ro
    depends_on: { kafka: { condition: service_healthy } }
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client -q 'EXISTS realy.v_training_dataset' | grep -q 1"]
      interval: 5s
      retries: 60
    restart: unless-stopped

  mock-model:
    build: { <<: *build, target: mock-model }
    image: realy/mock-model-server:dev
    ports: ["8001:8001", "8002:8002"]
    environment:
      <<: *jvm-env
      # trained proxy (realy train); empty -> bundled hand-set default weights
      MODEL_WEIGHTS: ${MODEL_WEIGHTS:-/models/proxy/fraud_mlp.weights.json}
      JAVA_OPTS: "-XX:+UseZGC -XX:+ZGenerational -Xmx1g -XX:+ExitOnOutOfMemoryError"
    # shared with the console: `realy train` writes versioned weights here and `realy deploy-model`
    # hot-swaps them in (ModelServerConfig.weights_path) - retrain -> redeploy -> measure, no rebuild.
    # Seeded from the image's bundled weights the first time the volume is created.
    volumes: ["realy-models:/models"]
    depends_on: { kafka: { condition: service_healthy } }
    restart: unless-stopped

  gateway:
    build: { <<: *build, target: gateway }
    image: realy/scoring-gateway:dev
    ports: ["8080:8080"]
    environment:
      <<: *jvm-env
      REDIS_URI: redis://redis:6379
      MODEL_TARGET: mock-model:8001
      INGRESS_KAFKA: "false"
      KAFKA_CONSUMERS: "3"
      MIRROR_TO_KAFKA: "true"
      JAVA_OPTS: "-XX:+UseZGC -XX:+ZGenerational -Xmx2g -XX:+ExitOnOutOfMemoryError"
    depends_on:
      kafka: { condition: service_healthy }
      redis: { condition: service_healthy }
      mock-model: { condition: service_healthy }
    restart: unless-stopped

  flink-jobmanager:
    build: { <<: *build, target: flink }
    image: realy/flink:dev
    hostname: flink-jobmanager
    ports: ["8081:8081"]
    # named volume is root-owned: hand it to the flink user before the stock entrypoint drops privileges
    user: "0:0"
    entrypoint: ["bash", "-c", "mkdir -p /checkpoints/savepoints && chown -R flink:flink /checkpoints && exec /docker-entrypoint.sh jobmanager"]
    environment:
      FLINK_PROPERTIES: *flink-common
    volumes: ["flink-checkpoints:/checkpoints"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8081/overview > /dev/null || exit 1"]
      interval: 5s
      retries: 60
    restart: unless-stopped

  flink-taskmanager:
    build: { <<: *build, target: flink }
    image: realy/flink:dev
    user: "0:0"
    entrypoint: ["bash", "-c", "chown -R flink:flink /checkpoints && exec /docker-entrypoint.sh taskmanager"]
    depends_on: { flink-jobmanager: { condition: service_healthy } }
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      REDIS_URI: redis://redis:6379
      MODEL_TARGET: mock-model:8001
      RUN_SEED: "42"
      # online-store writes per subtask in flight (backpressure beyond), and a longer command timeout than
      # the gateway's: a write is not on the decision path, a timeout declines the checkpoint
      STORE_MAX_IN_FLIGHT: "${STORE_MAX_IN_FLIGHT:-1000}"
      REDIS_COMMAND_TIMEOUT_MS: "${FLINK_REDIS_TIMEOUT_MS:-10000}"
      FLINK_PROPERTIES: *flink-common
    volumes: ["flink-checkpoints:/checkpoints", "./flink/tm-health.sh:/opt/realy/tm-health.sh:ro"]
    restart: unless-stopped
    # alive = registered with the JobManager (a hung JVM keeps the container up but serves nothing)
    healthcheck:
      test: ["CMD-SHELL", "/opt/realy/tm-health.sh"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s

  # Operator console + API + bench driver (emitters and collectors run here: one clock domain).
  console:
    build: { <<: *build, target: console }
    image: realy/console:dev
    ports: ["8090:8090"]
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      REDIS_URI: redis://redis:6379
      GATEWAY_ADMIN: http://gateway:8080
      GATEWAY_GRPC: gateway:8080
      MODEL_ADMIN: http://mock-model:8002
      FLINK_REST: http://flink-jobmanager:8081
      FLINK_KAFKA_BOOTSTRAP: kafka:29092
      CLICKHOUSE_URL: http://clickhouse:8123
      FLINK_UI_URL: ${FLINK_UI_URL:-http://localhost:8081}
      GRAFANA_URL: ${GRAFANA_URL:-http://localhost:3000}
      PROMETHEUS_URL: ${PROMETHEUS_URL:-http://localhost:9090}
      REALY_CONSOLE_TOKEN: ${REALY_CONSOLE_TOKEN:-}
      REALY_OWNER: console
      REALY_MODELS: /models
      # on `docker compose stop/down` the running run is aborted and given this long to drain and
      # write its partial report (stop_grace_period below must be longer)
      REALY_SHUTDOWN_GRACE_S: "60"
      # retained Flink checkpoints, read-only: a job lost with its JobManager restores from the newest one
      FLINK_CHECKPOINTS_LOCAL: /flink-checkpoints
    stop_grace_period: 75s
    volumes:
      - realy-runs:/runs
      - realy-data:/data
      - realy-models:/models
      - flink-checkpoints:/flink-checkpoints:ro
    shm_size: 1g
    depends_on:
      kafka-init: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
      gateway: { condition: service_healthy }
      mock-model: { condition: service_healthy }
      flink-jobmanager: { condition: service_healthy }
    restart: unless-stopped

  prometheus:
    profiles: [obs]
    image: prom/prometheus:v3.5.0
    ports: ["9090:9090"]
    volumes: ["./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    restart: unless-stopped

  grafana:
    profiles: [obs]
    image: grafana/grafana:12.2.0
    ports: ["3000:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      # run history (realy.runs) dashboards read ClickHouse directly
      GF_PLUGINS_PREINSTALL: grafana-clickhouse-datasource
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    restart: unless-stopped

volumes:
  flink-checkpoints: {}
  realy-runs: {}
  realy-data: {}
  realy-models: {}
