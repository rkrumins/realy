apiVersion: 1
# Run history (realy.runs) and the audit tables, via the official ClickHouse plugin
# (installed by GF_PLUGINS_PREINSTALL in docker-compose.yml).
datasources:
  - name: ClickHouse
    uid: realy-clickhouse
    type: grafana-clickhouse-datasource
    jsonData: { host: clickhouse, port: 8123, protocol: http, defaultDatabase: realy, username: default }
