name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      e2e:
        description: run the docker-compose end-to-end smoke
        type: boolean
        default: false

jobs:
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: gradle }
      - name: build + test (incl. Flink MiniCluster on RocksDB)
        working-directory: java
        run: ./gradlew test installDist :flink-job:shadowJar

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip }
      - run: pip install -e "python[control,train,dev]"
      - name: contracts are in sync (generated stubs, ClickHouse DDL, K8s manifests)
        run: |
          PYTHON=python scripts/gen-proto-python.sh
          python -m realy.codegen && python -m realy.k8s
          git diff --exit-code -- python contracts deploy/k8s/base/generated
      - name: tests
        working-directory: python
        run: python -m pytest -q
      - name: budget feasibility of all scenarios
        run: for s in scenarios/*.yaml; do realy budget "$(basename "$s" .yaml)" || true; done

  k8s:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.24" }
      - run: |
          go install sigs.k8s.io/kustomize/kustomize/v5@v5.7.1
          go install github.com/yannh/kubeconform/cmd/kubeconform@v0.7.0
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
      - run: make k8s-validate

  e2e:
    if: github.event_name == 'workflow_dispatch' && inputs.e2e
    needs: [java, python]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: gradle }
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip }
      - run: python -m venv .venv && .venv/bin/pip install -e "python[control,train,dev]"
      - run: make up
      - name: smoke (zero loss, budget) + exact verification on the Flink-inline topology
        run: |
          until curl -sf localhost:8080/health && curl -sf localhost:8081/overview; do sleep 3; done
          .venv/bin/realy run smoke --set traffic.duration_s=45
          .venv/bin/realy run flink-inline-smoke --set traffic.duration_s=45
          .venv/bin/realy verify "$(ls -td runs/flink-inline-smoke-*/ | head -1)"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: runs, path: "runs/*/report.*" }
