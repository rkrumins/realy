# baseline-v5 + rules over the nested blocks of a rich payment (pipeline payments-rich). The payment
# itself says what the card management and core banking systems know at authorisation: a card reported
# blocked, lost or stolen, an account on AML hold; and what the channel saw: a tampered device, a payee
# whose name does not match, gift cards in the basket. Candidates, not tuned (replay with rules-whatif).
extends: baseline
version: baseline-v5-rich1
rules:
  - id: CARD_NOT_ACTIVE
    when: "event.card_info.status in ['CARD_STATUS_BLOCKED', 'CARD_STATUS_LOST', 'CARD_STATUS_STOLEN']"
    action: DECLINE
    reason: "the card is blocked, lost or stolen (the status the payment carries)"
  - id: ACCOUNT_AML_HOLD
    when: "'AML_HOLD' in event.account_info.flags"
    action: REVIEW
    reason: "the account is on an AML hold"
  - id: TAMPERED_DEVICE_PAYMENT
    when: "(event.device_info.emulator || event.device_info.rooted) && f.amount_usd > 100.0"
    action: CHALLENGE
    reason: "over 100 from an emulator or a rooted device"
  - id: NEW_PAYEE_NAME_MISMATCH
    when: "event.payee_info.new_payee && event.payee_info.name_match == 'NO_MATCH'"
    action: REVIEW
    reason: "a first payment to a payee whose name does not match the account"
  - id: GIFT_CARD_BURST
    when: "event.items.exists(i, i.category == 'GIFT_CARD') && f.cust_gift_card_baskets_24h >= 2.0"
    action: REVIEW
    reason: "a second gift-card basket within a day"
  - id: FOREIGN_BIN_VELOCITY
    when: "f.cust_auth_attempts_sum_1h >= 4.0 || f.card_foreign_bin_count_24h >= 3.0"
    action: REVIEW
    reason: "repeated authentication attempts, or a card used repeatedly away from its issuing country"
